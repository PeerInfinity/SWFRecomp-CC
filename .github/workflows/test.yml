name: SWFRecomp CI

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run the trace test suite'
        required: false
        default: false
        type: boolean
      build_wasm:
        description: 'Build all WASM examples and deploy to docs/'
        required: false
        default: false
        type: boolean
      update_docs:
        description: 'Update opcode index and markdown docs (auto-enables run_tests)'
        required: false
        default: false
        type: boolean
      clean:
        description: 'Clean build (rebuild SWFRecomp from scratch, re-generate test files)'
        required: false
        default: false
        type: boolean
      limit_tests:
        description: 'Limit number of tests'
        required: false
        default: false
        type: boolean
      max_tests:
        description: 'Maximum number of tests (if limited)'
        required: false
        default: '10'
        type: string

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake swfmill

      - name: Build SWFRecomp
        run: |
          if [ "${{ inputs.clean }}" = "true" ] && [ -d SWFRecomp/build ]; then
            echo "Clean build requested, removing build directory..."
            rm -rf SWFRecomp/build
          fi

          mkdir -p SWFRecomp/build
          cd SWFRecomp/build
          cmake ..
          make -j$(nproc)
          echo "SWFRecomp built successfully"

      - name: Setup Emscripten
        if: inputs.build_wasm
        run: |
          git clone https://github.com/emscripten-core/emsdk.git emsdk
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Run tests
        if: inputs.run_tests || inputs.update_docs
        run: |
          cd SWFRecomp/tests

          CMD="./all_tests.sh --build"

          if [ "${{ inputs.limit_tests }}" = "true" ]; then
            CMD="$CMD --max-tests=${{ inputs.max_tests }}"
          fi

          if [ "${{ inputs.clean }}" = "true" ]; then
            CMD="$CMD --clean"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Update opcode docs
        if: inputs.update_docs
        run: |
          python3 scripts/build_opcode_index.py
          python3 scripts/generate_opcode_markdown.py

      - name: Generate graphics test SWFs
        if: inputs.build_wasm
        run: |
          for dir in SWFRecomp/tests/graphics/*/; do
            if [ -f "${dir}/create_test_swf.py" ] && [ ! -f "${dir}/test.swf" ]; then
              echo "Generating test.swf in ${dir}..."
              cd "${dir}"
              python3 create_test_swf.py
              cd - > /dev/null
            fi
          done

      - name: Build WASM examples
        if: inputs.build_wasm
        run: |
          source emsdk/emsdk_env.sh
          SWFRecomp/scripts/build_all_examples.sh

      - name: Display test summary
        if: always() && (inputs.run_tests || inputs.update_docs)
        run: |
          if [ -f SWFRecomp/tests/test_results.json ]; then
            echo "## Test Results" >> $GITHUB_STEP_SUMMARY
            python3 << 'PYTHON_SCRIPT' >> $GITHUB_STEP_SUMMARY
          import json
          with open('SWFRecomp/tests/test_results.json', 'r') as f:
              data = json.load(f)
              summary = data.get('summary', {})
              print(f"**Total Tests:** {summary.get('total_tests', 0)}")
              print(f"**Passed:** {summary.get('passed', 0)}")
              print(f"**Failed:** {summary.get('failed', 0)}")
              print(f"**Sub-tests Passed:** {summary.get('passed_sub_tests', 0)}/{summary.get('total_sub_tests', 0)}")
          PYTHON_SCRIPT
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-outputs
          path: |
            SWFRecomp/tests/test_results.json
            opcode-index.json
            opcode-index.md
            opcode-index-plain.md
            docs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit and push to ci-update branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all branches
          git fetch origin

          # Collect generated files that exist
          GENERATED_FILES=()

          if [ -f SWFRecomp/tests/test_results.json ]; then
            GENERATED_FILES+=(SWFRecomp/tests/test_results.json)
          fi
          for f in opcode-index.json opcode-index.md opcode-index-plain.md; do
            if [ -f "$f" ]; then
              GENERATED_FILES+=("$f")
            fi
          done
          if [ -d docs ]; then
            GENERATED_FILES+=(docs)
          fi

          if [ ${#GENERATED_FILES[@]} -eq 0 ]; then
            echo "No generated files to commit"
            exit 0
          fi

          # Save generated files to a temp location
          TMPDIR=$(mktemp -d)
          for f in "${GENERATED_FILES[@]}"; do
            mkdir -p "$TMPDIR/$(dirname "$f")"
            cp -r "$f" "$TMPDIR/$f"
          done

          # Switch to ci-update branch (create from master or sync existing)
          if git ls-remote --exit-code --heads origin ci-update; then
            echo "Branch ci-update exists, syncing with master"
            git checkout ci-update
            git pull origin ci-update

            # Sync all source from master
            git rm -rf . || true
            git checkout origin/master -- .
            git reset HEAD -- . || true
          else
            echo "Creating new branch ci-update from master"
            git checkout -b ci-update origin/master
          fi

          # Restore generated files
          for f in "${GENERATED_FILES[@]}"; do
            mkdir -p "$(dirname "$f")"
            if [ -d "$TMPDIR/$f" ]; then
              rm -rf "$f"
            fi
            cp -r "$TMPDIR/$f" "$f"
          done
          rm -rf "$TMPDIR"

          # Stage generated files
          for f in "${GENERATED_FILES[@]}"; do
            git add -f "$f"
          done

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Build commit message
          PARTS=()
          if [ "${{ inputs.run_tests }}" = "true" ] || [ "${{ inputs.update_docs }}" = "true" ]; then
            PARTS+=("test results")
          fi
          if [ "${{ inputs.update_docs }}" = "true" ]; then
            PARTS+=("opcode docs")
          fi
          if [ "${{ inputs.build_wasm }}" = "true" ]; then
            PARTS+=("WASM examples")
          fi

          SUMMARY=$(printf '%s, ' "${PARTS[@]}" | sed 's/, $//')
          if [ -z "$SUMMARY" ]; then
            SUMMARY="CI outputs"
          fi

          git commit -m "Update ${SUMMARY}" \
            -m "Generated by workflow run: ${{ github.run_id }}" \
            -m "Triggered by: ${{ github.actor }}" \
            -m "Options: run_tests=${{ inputs.run_tests }}, build_wasm=${{ inputs.build_wasm }}, update_docs=${{ inputs.update_docs }}, clean=${{ inputs.clean }}"

          git push origin ci-update

          echo "Committed to ci-update branch"
          echo "View: ${{ github.server_url }}/${{ github.repository }}/tree/ci-update"
