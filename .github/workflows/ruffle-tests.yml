name: Ruffle Tests

on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Test categories to run (comma-separated, or "all")'
        required: true
        type: choice
        options:
          - 'all'
          - 'avm1'
          - 'from_shumway'
        default: 'all'
      limit:
        description: 'Max number of tests to run per category (0 = all)'
        required: false
        default: '0'
        type: string
      parallel:
        description: 'Number of parallel runners for avm1 (1, 10, 20, or 30)'
        required: true
        type: choice
        options:
          - '1'
          - '10'
          - '20'
          - '30'
        default: '10'
  workflow_call:
    inputs:
      categories:
        description: 'Test categories (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      limit:
        description: 'Max number of tests to run per category (0 = all)'
        required: false
        default: '0'
        type: string
      parallel:
        description: 'Number of parallel runners for avm1'
        required: false
        default: '10'
        type: string

permissions:
  contents: write

env:
  AVM1_RESULTS: ruffle-tests/tests/swfs/avm1/_results
  SHUMWAY_RESULTS: ruffle-tests/tests/swfs/from_shumway/avm1/_results

jobs:
  # --- Single runner path ---
  ruffle-tests:
    name: Run Tests
    if: inputs.parallel == '1'
    runs-on: ubuntu-latest

    env:
      RUN_AVM1: ${{ inputs.categories == 'all' || inputs.categories == 'avm1' }}
      RUN_SHUMWAY: ${{ inputs.categories == 'all' || inputs.categories == 'from_shumway' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build SWFRecomp
        run: |
          mkdir -p SWFRecomp/build
          cd SWFRecomp/build
          cmake ..
          make -j$(nproc)

      - name: Download Ruffle test SWFs
        run: |
          CATS=""
          [ "$RUN_AVM1" = "true" ] && CATS="$CATS avm1"
          [ "$RUN_SHUMWAY" = "true" ] && CATS="$CATS from_shumway"
          bash ruffle-tests/download_tests.sh $CATS

      - name: Run recompiler on test SWFs
        run: |
          [ "$RUN_AVM1" = "true" ] && python3 ruffle-tests/run_tests.py || true
          [ "$RUN_SHUMWAY" = "true" ] && python3 ruffle-tests/run_tests.py --tests-dir=ruffle-tests/tests/swfs/from_shumway/avm1 || true

      - name: Fetch previous results
        run: |
          if git fetch origin ruffle-test-results 2>/dev/null; then
            if [ "$RUN_AVM1" = "true" ]; then
              mkdir -p ${{ env.AVM1_RESULTS }}
              git show origin/ruffle-test-results:${{ env.AVM1_RESULTS }}/results.json \
                > ${{ env.AVM1_RESULTS }}/results_previous.json 2>/dev/null || true
            fi
            if [ "$RUN_SHUMWAY" = "true" ]; then
              mkdir -p ${{ env.SHUMWAY_RESULTS }}
              git show origin/ruffle-test-results:${{ env.SHUMWAY_RESULTS }}/results.json \
                > ${{ env.SHUMWAY_RESULTS }}/results_previous.json 2>/dev/null || true
            fi
          fi

      - name: Verify runtime output (avm1)
        if: env.RUN_AVM1 == 'true'
        env:
          TZ: NPT-5:45
        run: |
          ARGS="-v"
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi
          python3 ruffle-tests/verify_output.py $ARGS

      - name: Verify runtime output (from_shumway/avm1)
        if: env.RUN_SHUMWAY == 'true'
        env:
          TZ: NPT-5:45
        run: |
          python3 ruffle-tests/verify_output.py -v \
            --tests-dir=ruffle-tests/tests/swfs/from_shumway/avm1

      - name: Generate filtered results
        if: always()
        run: |
          for dir in ${{ env.AVM1_RESULTS }} ${{ env.SHUMWAY_RESULTS }}; do
            if [ -f "$dir/results.json" ]; then
              python3 ruffle-tests/filter_results.py "$dir/results.json"
            fi
          done

      - name: Generate diff report
        if: always()
        run: |
          for dir in ${{ env.AVM1_RESULTS }} ${{ env.SHUMWAY_RESULTS }}; do
            if [ -f "$dir/results.json" ] && [ -f "$dir/results_previous.json" ]; then
              python3 scripts/diff_ruffle_results.py "$dir/results_previous.json" "$dir/results.json" \
                --json="$dir/results_diff.json" --markdown="$dir/results_diff.md"
            fi
          done

      - name: Generate markdown reports
        if: always()
        run: |
          python3 scripts/generate_ruffle_results_markdown.py --scan
          python3 scripts/generate_results_index.py

      - name: Generate step summary
        if: always()
        run: |
          python3 << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, glob, os
          print("## Ruffle Test Results\n")
          for rj in sorted(glob.glob("ruffle-tests/tests/swfs/**/_results/results.json", recursive=True)):
              with open(rj) as f:
                  r = json.load(f)
              # Derive category name
              cat = os.path.dirname(rj).replace("ruffle-tests/tests/swfs/", "").replace("/_results", "")
              m = r.get("metadata", {})
              # Try filtered
              fj = os.path.join(os.path.dirname(rj), "results_filtered.json")
              try:
                  with open(fj) as f:
                      rf = json.load(f)
                  ignored = rf["metadata"].get("ignored_count", 0)
                  print(f"### {cat}")
                  print(f"**{rf['pass']}/{rf['total']}** passing ({rf['pass_rate']}%) — filtered")
                  print(f"({r['pass']}/{r['total']} raw, {ignored} ignored)\n")
              except FileNotFoundError:
                  print(f"### {cat}")
                  print(f"**{r['pass']}/{r['total']}** passing ({r['pass_rate']}%)\n")
              if m.get("git_sha"):
                  print(f"Commit: `{m['git_sha'][:12]}`")
              if r.get("breakdown"):
                  print("| Category | Count |")
                  print("|----------|------:|")
                  print(f"| Pass | {r['pass']} |")
                  for k, v in r["breakdown"].items():
                      print(f"| {k} | {v} |")
              print()
          PYEOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruffle-test-results
          path: |
            ruffle-tests/tests/swfs/avm1/_results/
            ruffle-tests/tests/swfs/from_shumway/avm1/_results/
            ruffle-tests/results-index.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit results to ruffle-test-results branch
        if: always()
        run: |
          AVM1="${{ env.AVM1_RESULTS }}"
          SHUMWAY="${{ env.SHUMWAY_RESULTS }}"
          if [ ! -f "$AVM1/results.json" ] && [ ! -f "$SHUMWAY/results.json" ]; then
            echo "No results files to commit"
            exit 0
          fi

          # Save results to /tmp
          mkdir -p /tmp/avm1_results /tmp/shumway_results
          cp "$AVM1"/*.json "$AVM1"/*.md /tmp/avm1_results/ 2>/dev/null || true
          cp "$SHUMWAY"/*.json "$SHUMWAY"/*.md /tmp/shumway_results/ 2>/dev/null || true
          cp ruffle-tests/results-index.md /tmp/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

          git checkout -b ruffle-test-results

          # Restore results
          mkdir -p "$AVM1" "$SHUMWAY"
          cp /tmp/avm1_results/* "$AVM1/" 2>/dev/null || true
          cp /tmp/shumway_results/* "$SHUMWAY/" 2>/dev/null || true
          cp /tmp/results-index.md ruffle-tests/ 2>/dev/null || true

          git add -f "$AVM1"/*.json "$AVM1"/*.md 2>/dev/null || true
          git add -f "$SHUMWAY"/*.json "$SHUMWAY"/*.md 2>/dev/null || true
          git add -f ruffle-tests/results-index.md 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          LIMIT_MSG=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_MSG=" (limit=${{ inputs.limit }})"
          fi

          git commit -m "Update Ruffle test results${LIMIT_MSG}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push -f origin ruffle-test-results

  # --- Parallel runner path: shared setup ---
  setup-parallel:
    name: Setup (Build + Download + Recompile)
    if: inputs.parallel != '1'
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      total: ${{ steps.matrix.outputs.total }}
      run_avm1: ${{ steps.cats.outputs.run_avm1 }}
      run_shumway: ${{ steps.cats.outputs.run_shumway }}

    env:
      RUN_AVM1: ${{ inputs.categories == 'all' || inputs.categories == 'avm1' }}
      RUN_SHUMWAY: ${{ inputs.categories == 'all' || inputs.categories == 'from_shumway' }}

    steps:
      - name: Determine categories
        id: cats
        run: |
          echo "run_avm1=$RUN_AVM1" >> "$GITHUB_OUTPUT"
          echo "run_shumway=$RUN_SHUMWAY" >> "$GITHUB_OUTPUT"

      - name: Generate shard matrix
        id: matrix
        run: |
          N=${{ inputs.parallel }}
          echo "matrix=$(seq 1 $N | jq -cs '{shard: .}')" >> "$GITHUB_OUTPUT"
          echo "total=$N" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build SWFRecomp
        run: |
          mkdir -p SWFRecomp/build
          cd SWFRecomp/build
          cmake ..
          make -j$(nproc)

      - name: Download Ruffle test SWFs
        run: |
          CATS=""
          [ "$RUN_AVM1" = "true" ] && CATS="$CATS avm1"
          [ "$RUN_SHUMWAY" = "true" ] && CATS="$CATS from_shumway"
          bash ruffle-tests/download_tests.sh $CATS

      - name: Run recompiler on test SWFs
        run: |
          [ "$RUN_AVM1" = "true" ] && python3 ruffle-tests/run_tests.py || true
          [ "$RUN_SHUMWAY" = "true" ] && python3 ruffle-tests/run_tests.py --tests-dir=ruffle-tests/tests/swfs/from_shumway/avm1 || true

      - name: Upload SWFRecomp binary
        uses: actions/upload-artifact@v7
        with:
          name: setup-binary
          path: SWFRecomp/build/SWFRecomp
          retention-days: 1

      - name: Upload recompiled test data
        uses: actions/upload-artifact@v7
        with:
          name: setup-tests
          path: ruffle-tests/
          retention-days: 1

  # --- Parallel runner path: shards ---
  ruffle-tests-shard:
    name: Shard ${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}
    if: inputs.parallel != '1'
    needs: setup-parallel
    runs-on: ubuntu-latest

    env:
      RUN_AVM1: ${{ needs.setup-parallel.outputs.run_avm1 }}
      RUN_SHUMWAY: ${{ needs.setup-parallel.outputs.run_shumway }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-parallel.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Download SWFRecomp binary
        uses: actions/download-artifact@v7
        with:
          name: setup-binary
          path: SWFRecomp/build/

      - name: Make SWFRecomp binary executable
        run: chmod +x SWFRecomp/build/SWFRecomp

      - name: Download recompiled test data
        uses: actions/download-artifact@v7
        with:
          name: setup-tests
          path: ruffle-tests/

      - name: Verify runtime output — avm1 (shard ${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }})
        if: env.RUN_AVM1 == 'true'
        env:
          TZ: NPT-5:45
        run: |
          ARGS="-v --json=ruffle-tests/results-shard-avm1-${{ matrix.shard }}.json --shard=${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi
          python3 ruffle-tests/verify_output.py $ARGS

      - name: Verify runtime output — from_shumway (shard ${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }})
        if: env.RUN_SHUMWAY == 'true'
        env:
          TZ: NPT-5:45
        run: |
          ARGS="-v --tests-dir=ruffle-tests/tests/swfs/from_shumway/avm1"
          ARGS="$ARGS --json=ruffle-tests/results-shard-shumway-${{ matrix.shard }}.json"
          ARGS="$ARGS --shard=${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          python3 ruffle-tests/verify_output.py $ARGS

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}
          path: ruffle-tests/results-shard-*-${{ matrix.shard }}.json
          retention-days: 7

  # --- Combine shard results ---
  combine-results:
    name: Combine Results
    if: inputs.parallel != '1' && !cancelled()
    needs: [setup-parallel, ruffle-tests-shard]
    runs-on: ubuntu-latest

    env:
      RUN_AVM1: ${{ needs.setup-parallel.outputs.run_avm1 }}
      RUN_SHUMWAY: ${{ needs.setup-parallel.outputs.run_shumway }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Download SWFRecomp binary
        uses: actions/download-artifact@v7
        with:
          name: setup-binary
          path: SWFRecomp/build/

      - name: Make SWFRecomp binary executable
        run: chmod +x SWFRecomp/build/SWFRecomp

      - name: Download recompiled test data
        uses: actions/download-artifact@v7
        with:
          name: setup-tests
          path: ruffle-tests/

      - name: Fetch previous results
        run: |
          if git fetch origin ruffle-test-results 2>/dev/null; then
            if [ "$RUN_AVM1" = "true" ]; then
              mkdir -p ${{ env.AVM1_RESULTS }}
              git show origin/ruffle-test-results:${{ env.AVM1_RESULTS }}/results.json \
                > ${{ env.AVM1_RESULTS }}/results_previous.json 2>/dev/null || true
            fi
            if [ "$RUN_SHUMWAY" = "true" ]; then
              mkdir -p ${{ env.SHUMWAY_RESULTS }}
              git show origin/ruffle-test-results:${{ env.SHUMWAY_RESULTS }}/results.json \
                > ${{ env.SHUMWAY_RESULTS }}/results_previous.json 2>/dev/null || true
            fi
          fi

      - name: Download all shard artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: results-shard-*
          path: artifacts

      - name: Combine shard results
        run: |
          python3 << 'EOF'
          import json, glob, os
          from datetime import datetime, timezone

          # Map of category tag -> (shard glob pattern, output dir)
          categories = {
              "avm1": ("artifacts/results-shard-*/results-shard-avm1-*.json",
                       "ruffle-tests/tests/swfs/avm1/_results"),
              "shumway": ("artifacts/results-shard-*/results-shard-shumway-*.json",
                          "ruffle-tests/tests/swfs/from_shumway/avm1/_results"),
          }

          for cat, (pattern, out_dir) in categories.items():
              files = sorted(glob.glob(pattern))
              if not files:
                  print(f"{cat}: no shard files found, skipping")
                  continue

              print(f"{cat}: combining {len(files)} shard files")

              combined_tests = []
              total_duration = 0
              total_available = 0
              git_sha = None
              breakdown = {}
              pass_count = 0

              for f in files:
                  with open(f) as fp:
                      data = json.load(fp)
                  combined_tests.extend(data.get("tests", []))
                  m = data.get("metadata", {})
                  total_duration += m.get("duration_seconds", 0)
                  total_available = max(total_available, m.get("total_available", 0))
                  if not git_sha:
                      git_sha = m.get("git_sha")
                  pass_count += data.get("pass", 0)
                  for k, v in data.get("breakdown", {}).items():
                      breakdown[k] = breakdown.get(k, 0) + v

              total = len(combined_tests)
              report = {
                  "metadata": {
                      "timestamp": datetime.now(timezone.utc).isoformat(),
                      "git_sha": git_sha,
                      "duration_seconds": round(total_duration, 2),
                      "total_available": total_available,
                      "shards": len(files),
                  },
                  "total": total,
                  "pass": pass_count,
                  "fail": total - pass_count,
                  "pass_rate": round(100 * pass_count / total, 1) if total else 0,
                  "breakdown": {k: v for k, v in breakdown.items() if v},
                  "tests": sorted(combined_tests, key=lambda t: t["test"]),
              }

              os.makedirs(out_dir, exist_ok=True)
              with open(f"{out_dir}/results.json", "w") as fp:
                  json.dump(report, fp, indent=2)

              print(f"  {pass_count}/{total} passing ({report['pass_rate']}%)")
          EOF

      - name: Generate filtered results
        if: always()
        run: |
          for dir in ${{ env.AVM1_RESULTS }} ${{ env.SHUMWAY_RESULTS }}; do
            if [ -f "$dir/results.json" ]; then
              python3 ruffle-tests/filter_results.py "$dir/results.json"
            fi
          done

      - name: Generate diff report
        if: always()
        run: |
          for dir in ${{ env.AVM1_RESULTS }} ${{ env.SHUMWAY_RESULTS }}; do
            if [ -f "$dir/results.json" ] && [ -f "$dir/results_previous.json" ]; then
              python3 scripts/diff_ruffle_results.py "$dir/results_previous.json" "$dir/results.json" \
                --json="$dir/results_diff.json" --markdown="$dir/results_diff.md"
            fi
          done

      - name: Generate markdown reports
        if: always()
        run: |
          python3 scripts/generate_ruffle_results_markdown.py --scan
          python3 scripts/generate_results_index.py

      - name: Generate step summary
        if: always()
        run: |
          python3 << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, glob, os
          print("## Ruffle Test Results\n")
          for rj in sorted(glob.glob("ruffle-tests/tests/swfs/**/_results/results.json", recursive=True)):
              with open(rj) as f:
                  r = json.load(f)
              cat = os.path.dirname(rj).replace("ruffle-tests/tests/swfs/", "").replace("/_results", "")
              m = r.get("metadata", {})
              fj = os.path.join(os.path.dirname(rj), "results_filtered.json")
              try:
                  with open(fj) as f:
                      rf = json.load(f)
                  ignored = rf["metadata"].get("ignored_count", 0)
                  print(f"### {cat}")
                  print(f"**{rf['pass']}/{rf['total']}** passing ({rf['pass_rate']}%) — filtered")
                  print(f"({r['pass']}/{r['total']} raw, {ignored} ignored)\n")
              except FileNotFoundError:
                  print(f"### {cat}")
                  print(f"**{r['pass']}/{r['total']}** passing ({r['pass_rate']}%)\n")
              if m.get("git_sha"):
                  print(f"Commit: `{m['git_sha'][:12]}`")
              if m.get("duration_seconds"):
                  dur = m['duration_seconds']
                  shards = m.get('shards', 1)
                  print(f"Duration: {dur:.0f}s total across {shards} shard(s)")
              print()
          PYEOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruffle-test-results
          path: |
            ruffle-tests/tests/swfs/avm1/_results/
            ruffle-tests/tests/swfs/from_shumway/avm1/_results/
            ruffle-tests/results-index.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit results to ruffle-test-results branch
        if: always()
        run: |
          AVM1="${{ env.AVM1_RESULTS }}"
          SHUMWAY="${{ env.SHUMWAY_RESULTS }}"
          if [ ! -f "$AVM1/results.json" ] && [ ! -f "$SHUMWAY/results.json" ]; then
            echo "No results files to commit"
            exit 0
          fi

          # Save results to /tmp
          mkdir -p /tmp/avm1_results /tmp/shumway_results
          cp "$AVM1"/*.json "$AVM1"/*.md /tmp/avm1_results/ 2>/dev/null || true
          cp "$SHUMWAY"/*.json "$SHUMWAY"/*.md /tmp/shumway_results/ 2>/dev/null || true
          cp ruffle-tests/results-index.md /tmp/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

          git checkout -b ruffle-test-results

          # Restore results
          mkdir -p "$AVM1" "$SHUMWAY"
          cp /tmp/avm1_results/* "$AVM1/" 2>/dev/null || true
          cp /tmp/shumway_results/* "$SHUMWAY/" 2>/dev/null || true
          cp /tmp/results-index.md ruffle-tests/ 2>/dev/null || true

          git add -f "$AVM1"/*.json "$AVM1"/*.md 2>/dev/null || true
          git add -f "$SHUMWAY"/*.json "$SHUMWAY"/*.md 2>/dev/null || true
          git add -f ruffle-tests/results-index.md 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          LIMIT_MSG=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_MSG=" (limit=${{ inputs.limit }})"
          fi

          git commit -m "Update Ruffle test results${LIMIT_MSG}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push -f origin ruffle-test-results
