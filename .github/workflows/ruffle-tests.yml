name: Ruffle AVM1 Tests

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max number of tests to run (0 = all)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

jobs:
  ruffle-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build SWFRecomp
        run: |
          mkdir -p SWFRecomp/build
          cd SWFRecomp/build
          cmake ..
          make -j$(nproc)

      - name: Download Ruffle test SWFs
        run: |
          cd ruffle-tests
          bash download_tests.sh

      - name: Run recompiler on test SWFs
        run: python3 ruffle-tests/run_tests.py

      - name: Verify runtime output
        run: |
          ARGS="-v --json=ruffle-tests/results.json"
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi
          python3 ruffle-tests/verify_output.py $ARGS

      - name: Generate step summary
        if: always()
        run: |
          if [ -f ruffle-tests/results.json ]; then
            python3 << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("ruffle-tests/results.json") as f:
              r = json.load(f)
          m = r.get("metadata", {})
          print("## Ruffle AVM1 Test Results")
          print(f"**{r['pass']}/{r['total']}** tests passing ({r['pass_rate']}%)\n")
          if m.get("git_sha"):
              print(f"Commit: `{m['git_sha'][:12]}`")
          if m.get("duration_seconds"):
              print(f"Duration: {m['duration_seconds']:.0f}s")
          if m.get("total_available") and m["total_available"] != r["total"]:
              print(f"Ran {r['total']} of {m['total_available']} available tests")
          print()
          if r.get("breakdown"):
              print("| Category | Count |")
              print("|----------|------:|")
              print(f"| Pass | {r['pass']} |")
              for k, v in r["breakdown"].items():
                  print(f"| {k} | {v} |")
          EOF
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruffle-test-results
          path: ruffle-tests/results.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit results to ruffle-test-results branch
        if: always()
        run: |
          if [ ! -f ruffle-tests/results.json ]; then
            echo "No results file to commit"
            exit 0
          fi

          # Save results before switching branches
          cp ruffle-tests/results.json /tmp/results.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

          # Create branch from current HEAD (shares history with master, so it can be merged)
          git checkout -b ruffle-test-results

          # Restore results
          mkdir -p ruffle-tests
          cp /tmp/results.json ruffle-tests/results.json
          git add -f ruffle-tests/results.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          LIMIT_MSG=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_MSG=" (limit=${{ inputs.limit }})"
          fi

          git commit -m "Update Ruffle test results${LIMIT_MSG}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push -f origin ruffle-test-results
