name: Ruffle Tests

on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Test categories to run (all = the classic five suites; full = all + from_avmplus + the nine misc categories)'
        required: true
        type: choice
        options:
          - 'all'
          - 'full'
          - 'no_gnash'
          - 'avm1'
          - 'avm2'
          - 'from_avmplus'
          - 'misc'
          - 'from_shumway'
          - 'from_gnash'
        default: 'all'
      limit:
        description: 'Max tests per category (0 = all)'
        required: false
        default: '0'
        type: string
      parallel:
        description: 'Number of shards (1 = one shard, not a separate serial path)'
        required: true
        type: choice
        options:
          - '1'
          - '10'
          - '20'
          - '30'
        default: '30'
      mode:
        description: 'Build mode (graphics modes need Dawn prebuilt — see workflow comment)'
        required: true
        type: choice
        options:
          - 'graphics'
          - 'no-graphics'
        default: 'graphics'
      images:
        description: 'Image-comparison instrument: assert Pillow, record pixel magnitude stats, publish failing PNGs to ruffle-image-results (graphics mode only)'
        required: false
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
      single_test:
        description: 'Run a single test by name (overrides categories; auto-uses single runner)'
        required: false
        default: ''
        type: string
      swf_gc:
        description: 'Stage 3 mark-sweep collector mode for test binaries (empty = off; 1/quarantine/count; runs at cadence 1)'
        required: false
        default: ''
        type: string
      avm2_gc:
        description: 'Stage 11 AVM2 GC stress for AVM2 test binaries (empty = off; 1 = collect every tick)'
        required: false
        default: ''
        type: string
      extra_defines:
        description: 'Extra -D compile defines for test binaries (e.g. -DAVM2_SLOT_VERIFY to validate compile-time slot specialization)'
        required: false
        default: ''
        type: string
      try_helper:
        description: 'Force the recompiler try-helper emission mode on (1 = every try-bearing method/script region is emitted as a lifted body driven by the runtime helper; empty = default inline setjmp)'
        required: false
        default: ''
        type: string
      tu_split:
        description: 'Force the recompiler TU-split emission mode on: bytes of C text per abcN_methods_K.c body chunk (e.g. 4096 to make even small corpus tests split; empty/0 = default single-TU emission)'
        required: false
        default: ''
        type: string
      skip_avm1_payload:
        description: 'Force the recompiler dead-payload skip on (1 = an AS3 SWF omits the AVM2-dead bitmap_data/sound_data/video_data byte arrays from draws.c; empty = default full emission)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      categories:
        description: 'Test categories to run'
        required: false
        default: 'all'
        type: string
      limit:
        description: 'Max tests per category (0 = all)'
        required: false
        default: '0'
        type: string
      parallel:
        description: 'Number of shards (1 = one shard, not a separate serial path)'
        required: false
        default: '30'
        type: string
      mode:
        description: 'Build mode (graphics | no-graphics); graphics is the per-change default since 2026-07-23'
        required: false
        default: 'graphics'
        type: string
      images:
        description: 'Image-comparison instrument (true/false); graphics mode only'
        required: false
        default: 'false'
        type: string
      single_test:
        description: 'Run a single test by name'
        required: false
        default: ''
        type: string
      swf_gc:
        description: 'Stage 3 mark-sweep collector mode for test binaries (empty = off)'
        required: false
        default: ''
        type: string
      avm2_gc:
        description: 'Stage 11 AVM2 GC stress for AVM2 test binaries (empty = off; 1 = collect every tick)'
        required: false
        default: ''
        type: string
      extra_defines:
        description: 'Extra -D compile defines for test binaries'
        required: false
        default: ''
        type: string
      try_helper:
        description: 'Force the recompiler try-helper emission mode on (1 = on)'
        required: false
        default: ''
        type: string
      tu_split:
        description: 'Force the recompiler TU-split emission mode on (bytes per body chunk; empty/0 = off)'
        required: false
        default: ''
        type: string
      skip_avm1_payload:
        description: 'Force the recompiler dead-payload skip on for AS3 SWFs (1 = on)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write   # for `gh cache delete` in the prune-old-ccache step

# All test directories and their results locations.
# When adding a new category, add it here, to the DIRS lists below, and to
# the shard combine script's categories dict.
env:
  # Stage 3 mark-sweep collector (memory-reclamation plan): when the swf_gc
  # input is set, every test binary runs with the collector enabled at
  # cadence 1 (collect every tick) for maximum coverage. Empty = off.
  SWF_GC: ${{ inputs.swf_gc }}
  SWF_GC_CADENCE: ${{ inputs.swf_gc != '' && '1' || '' }}
  # Stage 11 AVM2 GC stress: when the avm2_gc input is set, every AVM2 test
  # binary collects between every tick (watermark 0) so the trace suite
  # exercises mark-sweep. Empty = off (default watermark; GC-inert on short
  # tests). AVM1 binaries ignore it.
  AVM2_GC_STRESS: ${{ inputs.avm2_gc }}
  # Extra compile defines for test binaries (verify_output.py reads this). Used
  # to validate the compile-time slot-specialization pass end-to-end across the
  # whole suite: -DAVM2_SLOT_VERIFY makes every specialized read cross-check its
  # compile-time slot index against the runtime resolve and abort on mismatch.
  SWFRECOMP_EXTRA_DEFINES: ${{ inputs.extra_defines }}
  # Try-helper emission mode (assessment §4.1): forces the recompiler to emit
  # every try-bearing method / script try body as a lifted function driven by
  # the runtime's setjmp helper, so generated code holds no jmp_buf. Empty =
  # off (the default inline emission, byte-identical to before the option).
  # A forced-on corpus run is how the mode's SEMANTICS are validated without a
  # browser; the page always compiles with it on.
  SWF_TRY_HELPER: ${{ inputs.try_helper }}
  # TU-split emission mode (assessment §1.3): the value is the target size in
  # bytes of each abc<tag>_methods_<k>.c body chunk. Empty/0 = off (one
  # methods TU per DoABC tag, byte-identical to before the option). A forced-on
  # corpus run validates the split's SEMANTICS; pass a deliberately small
  # target (4096) so even a small corpus test really splits — at the page's
  # 1.5 MB nothing in the Ruffle corpus would.
  SWF_TU_SPLIT: ${{ inputs.tu_split }}
  # Dead-payload skip (assessment §2.2): an AS3 SWF stops emitting the
  # AVM1-only bitmap_data / sound_data / video_data byte arrays into draws.c,
  # which only tagInit and the frame bodies read and runSWF_avm2 never reaches.
  # Empty = off (byte-identical to before the option, for AVM1 and AS3 alike).
  # A forced-on corpus run is what validates that nothing on the AVM2 path
  # actually depended on them: 74 AS3 corpus SWFs carry such a payload
  # (47 avm2, 14 visual, 13 from_shumway), including the sound_* trace tests
  # and the bitmap image-comparison tests.
  SWF_SKIP_AVM1_PAYLOAD: ${{ inputs.skip_avm1_payload }}
  AVM1_DIR: ruffle-tests/tests/swfs/avm1
  # AVM2 (AS3) suite — plan Stage 2 baseline: 1/1202 (hello_world), everything
  # else failing honestly (runtime abort on the first unimplemented opcode).
  AVM2_DIR: ruffle-tests/tests/swfs/avm2
  # from_avmplus (AVM2, Tamarin acceptance) - full-suite import 2026-07-24.
  AVMPLUS_DIR: ruffle-tests/tests/swfs/from_avmplus
  # The nine small categories from the full-suite import (one space-separated
  # list; each gets its own results dir + shard tag misc_<name>).
  MISC_DIRS: ruffle-tests/tests/swfs/timeline ruffle-tests/tests/swfs/text ruffle-tests/tests/swfs/swf ruffle-tests/tests/swfs/import_assets ruffle-tests/tests/swfs/audio ruffle-tests/tests/swfs/fonts ruffle-tests/tests/swfs/visual ruffle-tests/tests/swfs/mixed_avm ruffle-tests/tests/swfs/stage3d
  # Hand-written regression tests. Not downloaded — download_tests.sh never
  # touches this tree, so it takes no `CATS` entry, only a DIRS entry.
  REGRESSION_DIR: ruffle-tests/tests/swfs/regression
  SHUMWAY_AVM1_DIR: ruffle-tests/tests/swfs/from_shumway/avm1
  SHUMWAY_FLAT_DIR: ruffle-tests/tests/swfs/from_shumway
  GNASH_SWFMILL_DIR: ruffle-tests/tests/swfs/from_gnash/misc-swfmill.all
  GNASH_AS_DIR: ruffle-tests/tests/swfs/from_gnash/actionscript.all
  GNASH_MTASC_DIR: ruffle-tests/tests/swfs/from_gnash/misc-mtasc.all
  GNASH_MING_DIR: ruffle-tests/tests/swfs/from_gnash/misc-ming.all
  GNASH_SWFC_DIR: ruffle-tests/tests/swfs/from_gnash/misc-swfc.all

jobs:
  # --- Single-test path (debugging one named test) ---
  #
  # Replaces the old `ruffle-tests` single-runner job, which handled both
  # `parallel: '1'` and `single_test`. Nothing used the former: across the 20
  # runs before 2026-07-26 the job executed exactly once, for a single_test
  # dispatch, and no caller sets parallel=1 (all-tests.yml passes 10,
  # weekly-no-graphics.yml takes the default 30). `parallel: '1'` now simply
  # means a one-shard matrix through the normal path, so there is no longer a
  # second full copy of the setup + publish tail to keep in sync — which is
  # what let the results_flash.json bug hide in one copy for 2.5 months.
  #
  # This job deliberately does NOT publish. See the guard on combine-results'
  # "Commit results" step: a single-test run rebuilds the results tree from
  # the master checkout, so publishing it force-pushed a stale tree over the
  # branch. The verdict here is the log line plus the uploaded artifact.
  single-test:
    name: Single test (${{ inputs.single_test }})
    if: inputs.single_test != ''
    runs-on: ubuntu-latest

    env:
      # Same crash capture as the shards (see crash-capture-setup). Free here,
      # and a single-test dispatch is the cheapest way to re-examine a crash
      # that IS reproducible.
      SWF_CORE_CAPTURE_DIR: /tmp/swf-cores
      SWF_DEBUG_INFO: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip Pillow

      - name: Install system dependencies
        run: |
          # Bare apt-get has no timeout: on 2026-08-19 two runs sat 5 h in this
          # step on a wedged mirror. Bound each attempt and retry.
          for i in 1 2 3; do
            sudo timeout 600 apt-get update && sudo timeout 900 apt-get install -y build-essential cmake ccache && break
            echo "apt-get attempt $i failed; retrying"; sleep 30
            [ "$i" = 3 ] && { echo 'apt-get failed after 3 attempts'; exit 1; }
          done

      # Graphics mode needs Vulkan + a prebuilt Dawn library. Dawn is built by
      # .github/workflows/build-dawn.yml and stored in the GitHub Actions
      # cache. Restore-only, like the shards: a one-test debug run should fail
      # fast with instructions rather than sit through a ~30 min inline build.
      - name: Compute Dawn cache key
        if: inputs.mode != 'no-graphics'
        id: dawn_key
        run: |
          script_hash=$(sha256sum scripts/build_dawn.sh | cut -c1-16)
          # The cache_schema 'v1' must match the default in build-dawn.yml.
          # If you bump it there, bump it here too.
          key="dawn-prebuilt-linux-x64-${script_hash}-v1"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore Dawn from cache
        if: inputs.mode != 'no-graphics'
        id: dawn_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dawn-install
          key: ${{ steps.dawn_key.outputs.key }}

      - name: Verify Dawn cache hit
        if: inputs.mode != 'no-graphics'
        run: |
          if [ "${{ steps.dawn_cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Dawn cache miss. Populate it with 'gh workflow run build-dawn.yml' and re-dispatch, or use -f mode=no-graphics."
            exit 1
          fi

      # libav* back SWFModernRuntime's video codec
      # (SWFRecompDocs/plans/video-codec-support-plan.md): verify_output.py
      # probes pkg-config in graphics modes and defines SWF_HAVE_LIBAVCODEC
      # when found; absent, only ScreenVideo (FLV codec 3) decodes.
      - name: Install Vulkan + libavcodec
        if: inputs.mode != 'no-graphics'
        uses: ./.github/actions/graphics-apt-deps

      - name: Arm core dumps
        uses: ./.github/actions/crash-capture-setup

      - name: Pin ccache directory
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # Restore-only: a debug run reuses whatever the sharded runs left warm
      # and never writes a cache entry of its own. That is what the old job's
      # 35-line "Prune old ccache entries" tail existed to clean up.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ruffle-shard-${{ inputs.mode }}-
          restore-keys: |
            ccache-ruffle-shard-${{ inputs.mode }}-
            ccache-ruffle-shard-
            ccache-ruffle-single-

      - name: Configure ccache
        run: |
          ccache --max-size=300M
          ccache -z

      - name: Build SWFRecomp
        run: |
          mkdir -p SWFRecomp/build
          cd SWFRecomp/build
          cmake ..
          make -j$(nproc)

      # Every category, not the `categories` selection: single_test takes a
      # bare test name and verify_output.py locates the suite that owns it, so
      # filtering the download would make a from_avmplus or misc test
      # un-runnable under the default categories=all. (regression/ is
      # git-tracked, never downloaded.)
      - name: Download Ruffle test SWFs
        run: |
          bash ruffle-tests/download_tests.sh \
            avm1 avm2 from_avmplus from_shumway from_gnash \
            timeline text swf import_assets audio fonts visual mixed_avm stage3d

      # No bulk recompiler pass: verify_output.py recompiles the test it is
      # about to run (recompile_swf(), mtime-cached), so the sharded path's
      # separate recompile step buys a single test nothing.
      - name: Verify single test
        env:
          TZ: NPT-5:45
        run: |
          echo "=== Running single test: ${{ inputs.single_test }} (mode=${{ inputs.mode }}) ==="
          python3 ruffle-tests/verify_output.py -v \
            --test='${{ inputs.single_test }}' \
            --mode='${{ inputs.mode }}' \
            --diff

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: single-test-results
          path: ruffle-tests/tests/swfs/**/_results/*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Collect crash captures
        if: always()
        uses: ./.github/actions/crash-capture-collect
        with:
          artifact-name: crash-cores-single-test

  # --- Parallel runner path: shared setup ---
  setup-parallel:
    name: Setup (Build + Download + Recompile)
    if: inputs.single_test == ''
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      total: ${{ steps.matrix.outputs.total }}
      run_avm1: ${{ steps.cats.outputs.run_avm1 }}
      run_avm2: ${{ steps.cats.outputs.run_avm2 }}
      run_avmplus: ${{ steps.cats.outputs.run_avmplus }}
      run_misc: ${{ steps.cats.outputs.run_misc }}
      run_shumway: ${{ steps.cats.outputs.run_shumway }}
      run_gnash: ${{ steps.cats.outputs.run_gnash }}

    env:
      RUN_AVM1: ${{ inputs.categories == 'all' || inputs.categories == 'full' || inputs.categories == 'no_gnash' || inputs.categories == 'avm1' }}
      RUN_AVM2: ${{ inputs.categories == 'all' || inputs.categories == 'full' || inputs.categories == 'no_gnash' || inputs.categories == 'avm2' }}
      RUN_AVMPLUS: ${{ inputs.categories == 'full' || inputs.categories == 'from_avmplus' }}
      RUN_MISC: ${{ inputs.categories == 'full' || inputs.categories == 'misc' }}
      RUN_SHUMWAY: ${{ inputs.categories == 'all' || inputs.categories == 'full' || inputs.categories == 'no_gnash' || inputs.categories == 'from_shumway' }}
      RUN_GNASH: ${{ inputs.categories == 'all' || inputs.categories == 'full' || inputs.categories == 'from_gnash' }}

    steps:
      - name: Determine categories
        id: cats
        run: |
          echo "run_avm1=$RUN_AVM1" >> "$GITHUB_OUTPUT"
          echo "run_avm2=$RUN_AVM2" >> "$GITHUB_OUTPUT"
          echo "run_avmplus=$RUN_AVMPLUS" >> "$GITHUB_OUTPUT"
          echo "run_misc=$RUN_MISC" >> "$GITHUB_OUTPUT"
          echo "run_shumway=$RUN_SHUMWAY" >> "$GITHUB_OUTPUT"
          echo "run_gnash=$RUN_GNASH" >> "$GITHUB_OUTPUT"

      - name: Generate shard matrix
        id: matrix
        run: |
          N=${{ inputs.parallel }}
          echo "matrix=$(seq 1 $N | jq -cs '{shard: .}')" >> "$GITHUB_OUTPUT"
          echo "total=$N" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: |
          # Bare apt-get has no timeout: on 2026-08-19 two runs sat 5 h in this
          # step on a wedged mirror. Bound each attempt and retry.
          for i in 1 2 3; do
            sudo timeout 600 apt-get update && sudo timeout 900 apt-get install -y build-essential cmake && break
            echo "apt-get attempt $i failed; retrying"; sleep 30
            [ "$i" = 3 ] && { echo 'apt-get failed after 3 attempts'; exit 1; }
          done

      # --- Dawn cache: restore-or-build, then save. Mirrors build-dawn.yml.
      # This populates the Dawn cache before any shards run, so shard-level
      # `cache/restore@v4` always hits. On miss this adds ~30 min to the
      # workflow (recovers the cache automatically); on hit it's ~30 sec.
      - name: Compute Dawn cache key
        if: inputs.mode != 'no-graphics'
        id: dawn_key
        run: |
          script_hash=$(sha256sum scripts/build_dawn.sh | cut -c1-16)
          # The cache_schema 'v1' must match the default in build-dawn.yml.
          key="dawn-prebuilt-linux-x64-${script_hash}-v1"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore-or-save Dawn cache
        if: inputs.mode != 'no-graphics'
        id: dawn_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dawn-install
          key: ${{ steps.dawn_key.outputs.key }}

      - name: Install Dawn build dependencies (cache miss)
        if: inputs.mode != 'no-graphics' && steps.dawn_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y git ninja-build python3

      - name: Build Dawn (cache miss)
        if: inputs.mode != 'no-graphics' && steps.dawn_cache.outputs.cache-hit != 'true'
        run: |
          echo "::notice::Dawn cache miss — building inline (~30 min). actions/cache@v4 will save the result automatically."
          bash scripts/build_dawn.sh "${RUNNER_TEMP}/dawn-install"

      # Populate (not install) the graphics .deb cache while the shards are
      # still queued, so all 30 restore it instead of each hitting apt.
      # setup-parallel does not need the packages itself — it only builds the
      # recompiler and recompiles SWFs.
      - name: Populate graphics apt .deb cache
        if: inputs.mode != 'no-graphics'
        uses: ./.github/actions/graphics-apt-deps
        with:
          download-only: 'true'

      - name: Build SWFRecomp
        run: |
          mkdir -p SWFRecomp/build
          cd SWFRecomp/build
          cmake ..
          make -j$(nproc)

      - name: Download Ruffle test SWFs
        run: |
          CATS=""
          [ "$RUN_AVM1" = "true" ] && CATS="$CATS avm1"
          [ "$RUN_AVM2" = "true" ] && CATS="$CATS avm2"
          [ "$RUN_AVMPLUS" = "true" ] && CATS="$CATS from_avmplus"
          [ "$RUN_MISC" = "true" ] && CATS="$CATS timeline text swf import_assets audio fonts visual mixed_avm stage3d"
          [ "$RUN_SHUMWAY" = "true" ] && CATS="$CATS from_shumway"
          [ "$RUN_GNASH" = "true" ] && CATS="$CATS from_gnash"
          bash ruffle-tests/download_tests.sh $CATS

      - name: Run recompiler on test SWFs
        run: |
          DIRS=""
          [ "$RUN_AVM1" = "true" ] && DIRS="$DIRS $AVM1_DIR $REGRESSION_DIR"
          [ "$RUN_AVM2" = "true" ] && DIRS="$DIRS $AVM2_DIR"
          [ "$RUN_AVMPLUS" = "true" ] && DIRS="$DIRS $AVMPLUS_DIR"
          [ "$RUN_MISC" = "true" ] && DIRS="$DIRS $MISC_DIRS"
          if [ "$RUN_SHUMWAY" = "true" ]; then
            DIRS="$DIRS $SHUMWAY_AVM1_DIR $SHUMWAY_FLAT_DIR"
          fi
          [ "$RUN_GNASH" = "true" ] && DIRS="$DIRS $GNASH_SWFMILL_DIR $GNASH_AS_DIR $GNASH_MTASC_DIR $GNASH_MING_DIR $GNASH_SWFC_DIR"
          for dir in $DIRS; do
            [ -d "$dir" ] && python3 ruffle-tests/run_tests.py --tests-dir="$dir" || true
          done

      - name: Upload SWFRecomp binary
        uses: actions/upload-artifact@v7
        with:
          name: setup-binary
          path: SWFRecomp/build/SWFRecomp
          retention-days: 1

      - name: Upload recompiled test data
        uses: actions/upload-artifact@v7
        with:
          name: setup-tests
          path: ruffle-tests/
          retention-days: 1

  # --- Parallel runner path: shards ---
  ruffle-tests-shard:
    name: Shard ${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}
    if: inputs.single_test == ''
    needs: setup-parallel
    runs-on: ubuntu-latest

    env:
      # Crash capture: verify_output.py preserves the core + the exact
      # test_run + its sources under here whenever a test dies on a signal.
      # Armed by the crash-capture-setup step below; unset => no-op.
      SWF_CORE_CAPTURE_DIR: /tmp/swf-cores
      # -g1 (line tables, no locals) so a captured core backtraces to
      # file:line. Measured cost: no change in compile time, test_run 1.4 ->
      # 2.3 MB. -g1 does not affect codegen.
      SWF_DEBUG_INFO: '1'
      RUN_AVM1: ${{ needs.setup-parallel.outputs.run_avm1 }}
      RUN_AVM2: ${{ needs.setup-parallel.outputs.run_avm2 }}
      RUN_AVMPLUS: ${{ needs.setup-parallel.outputs.run_avmplus }}
      RUN_MISC: ${{ needs.setup-parallel.outputs.run_misc }}
      RUN_SHUMWAY: ${{ needs.setup-parallel.outputs.run_shumway }}
      RUN_GNASH: ${{ needs.setup-parallel.outputs.run_gnash }}
      # Image-comparison instrument (images=true). Appended UNQUOTED to every
      # verify_output.py invocation below, so when the input is off this is the
      # empty string and each command line is byte-identical to what it was.
      #
      # Image comparisons themselves already ran in every graphics shard (they
      # are gated on `mode`, not on this input, and Pillow has been installed
      # here all along). What the flag adds is: a hard failure instead of a
      # silent skip if Pillow is missing, the per-comparison magnitude stats
      # the baseline report bins on, and the PNG export collected below.
      IMAGE_ARGS: ${{ inputs.images == 'true' && '--images --image-out-dir=/tmp/swf-image-out' || '' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-parallel.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip Pillow

      # verify_output.py's image comparison degrades SILENTLY without Pillow
      # (compare_images returns "not installed, skipping" and the caller
      # records nothing), so a broken pip step above would publish an empty
      # image baseline that reads as "no failures". The verify invocations are
      # all `|| true`, so verify_output's own --images guard cannot fail the
      # job — this step is what turns a missing Pillow red. Costs one import
      # on the runs that ask for images and nothing at all otherwise.
      - name: Verify Pillow is present (images=true)
        if: inputs.images == 'true'
        run: |
          if [ "${{ inputs.mode }}" = "no-graphics" ]; then
            echo "::error::images=true requires mode=graphics; no renders are produced in no-graphics mode."
            exit 1
          fi
          python3 - <<'EOF' || { echo "::error::images=true but Pillow is not importable — refusing to produce an empty image baseline."; exit 1; }
          import PIL
          print("Pillow", PIL.__version__)
          EOF

      - name: Install system dependencies
        run: |
          # Bare apt-get has no timeout: on 2026-08-19 two runs sat 5 h in this
          # step on a wedged mirror. Bound each attempt and retry.
          for i in 1 2 3; do
            sudo timeout 600 apt-get update && sudo timeout 900 apt-get install -y build-essential ccache && break
            echo "apt-get attempt $i failed; retrying"; sleep 30
            [ "$i" = 3 ] && { echo 'apt-get failed after 3 attempts'; exit 1; }
          done

      # Dawn comes from the cache that setup-parallel populated; see the
      # single-test job for how that cache is produced and keyed.
      - name: Compute Dawn cache key
        if: inputs.mode != 'no-graphics'
        id: dawn_key
        run: |
          script_hash=$(sha256sum scripts/build_dawn.sh | cut -c1-16)
          key="dawn-prebuilt-linux-x64-${script_hash}-v1"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore Dawn from cache
        if: inputs.mode != 'no-graphics'
        id: dawn_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dawn-install
          key: ${{ steps.dawn_key.outputs.key }}

      - name: Verify Dawn cache hit
        if: inputs.mode != 'no-graphics'
        run: |
          if [ "${{ steps.dawn_cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Dawn cache miss in shard. setup-parallel was supposed to populate it — investigate why this shard didn't see the cache."
            exit 1
          fi

      # setup-parallel populated the .deb cache, so this restores and
      # dpkg -i's with no network. That is the point: this step running
      # `apt-get install` 30 times per run is what dropped shards.
      - name: Install Vulkan + libavcodec
        if: inputs.mode != 'no-graphics'
        uses: ./.github/actions/graphics-apt-deps

      # The shard job is the ONLY instrument that has ever reproduced
      # avm2/edittext_align's intermittent segfault (loader-arc.md §7), and it
      # used to discard the evidence. Arm cores here, collect at the end.
      - name: Arm core dumps
        uses: ./.github/actions/crash-capture-setup

      - name: Pin ccache directory
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # SHARED key per mode (NOT per shard). Every shard compiles the same
          # runtime (action.c etc. — the expensive part), so one ccache per
          # mode accelerates them all. All shards in a run save this identical
          # key; GitHub keeps the first writer (the rest get a harmless "cache
          # already exists"), so a run produces ~1 ccache entry per mode, not
          # ~30. Previously each shard saved its own key
          # (ccache-ruffle-shard-<N>-<mode>-<run_id>): 30 shards × 2 modes ×
          # keep-2 ≈ 19 GiB potential, which blew the 10 GiB per-repo cap and
          # LRU-evicted the Dawn cache (forcing ~30-min rebuilds). The broad
          # restore-keys fall back to any prior shard cache during the
          # transition from the old per-shard keys.
          key: ccache-ruffle-shard-${{ inputs.mode }}-${{ github.run_id }}
          restore-keys: |
            ccache-ruffle-shard-${{ inputs.mode }}-
            ccache-ruffle-shard-

      - name: Configure ccache
        run: |
          # Per-entry cap. Only ~1 entry per mode now survives (shared key
          # above), so total ccache stays well under 1 GiB, leaving ample room
          # for the Dawn cache (~few hundred MiB) under the 10 GiB per-repo
          # limit. This headroom is what keeps Dawn from being LRU-evicted.
          ccache --max-size=300M
          ccache -z

      - name: Download SWFRecomp binary
        uses: actions/download-artifact@v7
        with:
          name: setup-binary
          path: SWFRecomp/build/

      - name: Make SWFRecomp binary executable
        run: chmod +x SWFRecomp/build/SWFRecomp

      - name: Download recompiled test data
        uses: actions/download-artifact@v7
        with:
          name: setup-tests
          path: ruffle-tests/

      - name: Verify AVM1 (shard ${{ matrix.shard }})
        if: env.RUN_AVM1 == 'true'
        timeout-minutes: 30
        env:
          TZ: NPT-5:45
        run: |
          SHARD="${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          LIMIT_ARGS=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARGS="--limit=${{ inputs.limit }}"
          fi
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --json=ruffle-tests/results-shard-avm1-${{ matrix.shard }}.json \
            --shard="$SHARD" $LIMIT_ARGS $IMAGE_ARGS || true

      - name: Upload AVM1 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}-avm1
          path: ruffle-tests/results-shard-avm1-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify regression (shard ${{ matrix.shard }})
        if: "!cancelled() && env.RUN_AVM1 == 'true'"
        timeout-minutes: 10
        env:
          TZ: NPT-5:45
        run: |
          SHARD="${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$REGRESSION_DIR" \
            --json=ruffle-tests/results-shard-regression-${{ matrix.shard }}.json \
            --shard="$SHARD" $IMAGE_ARGS || true

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}-regression
          path: ruffle-tests/results-shard-regression-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify AVM2 (shard ${{ matrix.shard }})
        if: "!cancelled() && env.RUN_AVM2 == 'true'"
        timeout-minutes: 30
        env:
          TZ: NPT-5:45
        run: |
          SHARD="${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          LIMIT_ARGS=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARGS="--limit=${{ inputs.limit }}"
          fi
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$AVM2_DIR" \
            --json=ruffle-tests/results-shard-avm2-${{ matrix.shard }}.json \
            --shard="$SHARD" $LIMIT_ARGS $IMAGE_ARGS || true

      - name: Upload AVM2 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}-avm2
          path: ruffle-tests/results-shard-avm2-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify from_avmplus (shard ${{ matrix.shard }})
        if: "!cancelled() && env.RUN_AVMPLUS == 'true'"
        timeout-minutes: 45
        env:
          TZ: NPT-5:45
        run: |
          SHARD="${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          LIMIT_ARGS=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARGS="--limit=${{ inputs.limit }}"
          fi
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$AVMPLUS_DIR" \
            --json=ruffle-tests/results-shard-avmplus-${{ matrix.shard }}.json \
            --shard="$SHARD" $LIMIT_ARGS $IMAGE_ARGS || true

      - name: Upload from_avmplus results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}-avmplus
          path: ruffle-tests/results-shard-avmplus-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify misc suites (shard ${{ matrix.shard }})
        if: "!cancelled() && env.RUN_MISC == 'true'"
        timeout-minutes: 20
        env:
          TZ: NPT-5:45
        run: |
          SHARD="${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          for dir in $MISC_DIRS; do
            name=$(basename "$dir")
            [ -d "$dir" ] || continue
            python3 ruffle-tests/verify_output.py -v \
              --mode='${{ inputs.mode }}' \
              --tests-dir="$dir" \
              --json=ruffle-tests/results-shard-misc_${name}-${{ matrix.shard }}.json \
              --shard="$SHARD" $IMAGE_ARGS || true
          done

      - name: Upload misc results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}-misc
          path: ruffle-tests/results-shard-misc_*-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify Shumway (shard ${{ matrix.shard }})
        if: "!cancelled() && env.RUN_SHUMWAY == 'true'"
        timeout-minutes: 10
        env:
          TZ: NPT-5:45
        run: |
          SHARD="${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$SHUMWAY_AVM1_DIR" \
            --json=ruffle-tests/results-shard-shumway_avm1-${{ matrix.shard }}.json \
            --shard="$SHARD" $IMAGE_ARGS || true
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$SHUMWAY_FLAT_DIR" \
            --json=ruffle-tests/results-shard-shumway_flat-${{ matrix.shard }}.json \
            --shard="$SHARD" $IMAGE_ARGS || true

      - name: Upload Shumway results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}-shumway
          path: ruffle-tests/results-shard-shumway_*-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify Gnash (shard ${{ matrix.shard }})
        if: "!cancelled() && env.RUN_GNASH == 'true'"
        timeout-minutes: 60
        env:
          TZ: NPT-5:45
        run: |
          SHARD="${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$GNASH_SWFMILL_DIR" \
            --json=ruffle-tests/results-shard-gnash_swfmill-${{ matrix.shard }}.json \
            --shard="$SHARD" $IMAGE_ARGS || true
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$GNASH_AS_DIR" \
            --json=ruffle-tests/results-shard-gnash_as-${{ matrix.shard }}.json \
            --shard="$SHARD" $IMAGE_ARGS || true
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$GNASH_MTASC_DIR" \
            --json=ruffle-tests/results-shard-gnash_mtasc-${{ matrix.shard }}.json \
            --shard="$SHARD" $IMAGE_ARGS || true
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$GNASH_MING_DIR" \
            --json=ruffle-tests/results-shard-gnash_ming-${{ matrix.shard }}.json \
            --shard="$SHARD" $IMAGE_ARGS || true
          # gotoFrame2Test (misc-ming) and gotoFrameFromInterval2 (misc-swfc)
          # were excluded as "hanging" in 4b79110d6; both are now fixed and
          # grade PASS / ruffle_matched, so they are no longer excluded.
          # gotoFrameFromInterval (no "2") stays excluded: it is a
          # known_failure runaway where both we AND Ruffle diverge from Flash
          # (Ruffle's own output.ruffle.txt is an unbounded runaway). It hangs
          # to the 30s per-test timeout with no pass-rate upside, so grading it
          # would only burn ~30s of CI per run. See
          # ruffle-tests/tests/swfs/_investigation/NEW_UPSTREAM_TESTS_TRIAGE.md.
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$GNASH_SWFC_DIR" \
            --json=ruffle-tests/results-shard-gnash_swfc-${{ matrix.shard }}.json \
            --shard="$SHARD" $IMAGE_ARGS \
            --exclude=gotoFrameFromInterval || true

      - name: Upload Gnash results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}-gnash
          path: ruffle-tests/results-shard-gnash_*-${{ matrix.shard }}.json
          retention-days: 7

      # Failing image comparisons only — verify_output --image-out-dir writes
      # nothing for a passing render, so this artifact is empty on a shard
      # whose renders were all correct (hence if-no-files-found: ignore).
      - name: Upload failing image PNGs (shard ${{ matrix.shard }})
        if: always() && inputs.images == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-shard-${{ matrix.shard }}
          path: /tmp/swf-image-out
          retention-days: 7
          if-no-files-found: ignore

      # No-op unless a test crashed: one `ls`, then gdb + upload only if a
      # capture directory exists.
      - name: Collect crash captures (shard ${{ matrix.shard }})
        if: always()
        uses: ./.github/actions/crash-capture-collect
        with:
          artifact-name: crash-cores-shard-${{ matrix.shard }}

      - name: ccache stats (shard ${{ matrix.shard }})
        if: always()
        run: ccache -s

  # --- Combine shard results ---
  combine-results:
    name: Combine Results
    if: inputs.single_test == '' && !cancelled()
    needs: [setup-parallel, ruffle-tests-shard]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip Pillow

      - name: Install system dependencies
        run: |
          # Bare apt-get has no timeout: on 2026-08-19 two runs sat 5 h in this
          # step on a wedged mirror. Bound each attempt and retry.
          for i in 1 2 3; do
            sudo timeout 600 apt-get update && sudo timeout 900 apt-get install -y build-essential ccache && break
            echo "apt-get attempt $i failed; retrying"; sleep 30
            [ "$i" = 3 ] && { echo 'apt-get failed after 3 attempts'; exit 1; }
          done

      - name: Pin ccache directory
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ruffle-combine-${{ github.run_id }}
          restore-keys: |
            ccache-ruffle-combine-
            ccache-ruffle-shard-

      - name: Configure ccache
        run: |
          # Combine job: one ccache entry per run; small, leaves room for the
          # Dawn cache under the 10 GiB per-repo limit.
          ccache --max-size=300M
          ccache -z

      - name: Download SWFRecomp binary
        uses: actions/download-artifact@v7
        with:
          name: setup-binary
          path: SWFRecomp/build/

      - name: Make SWFRecomp binary executable
        run: chmod +x SWFRecomp/build/SWFRecomp

      - name: Download recompiled test data
        uses: actions/download-artifact@v7
        with:
          name: setup-tests
          path: ruffle-tests/

      - name: Fetch previous results
        # Must run AFTER artifact download — the setup-tests artifact includes
        # stale _results/ files from the master checkout, which would overwrite
        # the fetched previous results if we fetched first.
        run: |
          DIRS="$AVM1_DIR $AVM2_DIR $AVMPLUS_DIR $MISC_DIRS $REGRESSION_DIR $SHUMWAY_AVM1_DIR $SHUMWAY_FLAT_DIR $GNASH_SWFMILL_DIR $GNASH_AS_DIR $GNASH_MTASC_DIR $GNASH_MING_DIR $GNASH_SWFC_DIR"
          # Per-mode previous baseline (graphics diffs against graphics, etc.).
          case "${{ inputs.mode }}" in
            graphics) PREV_STEM="results_graphics" ;;
            *) PREV_STEM="results" ;;
          esac
          if git fetch origin ruffle-test-results 2>/dev/null; then
            for dir in $DIRS; do
              mkdir -p "$dir/_results"
              git show "origin/ruffle-test-results:$dir/_results/${PREV_STEM}.json" \
                > "$dir/_results/${PREV_STEM}_previous.json" 2>/dev/null || true
            done
          fi

      - name: Download all shard artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: results-shard-*
          path: artifacts

      - name: Combine shard results
        env:
          EXPECTED_SHARDS: ${{ needs.setup-parallel.outputs.total }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 << 'EOF'
          import json, glob, os
          from datetime import datetime, timezone

          expected_shards = int(os.environ.get("EXPECTED_SHARDS") or "0")
          # Mode-specific output filename so a graphics-mode run doesn't
          # overwrite the no-graphics results.json (and vice versa).
          # Mirrors verify_output.py's single-runner path.
          mode = os.environ.get("MODE") or "no-graphics"
          if mode == "graphics":
              out_filename = "results_graphics.json"
          else:
              out_filename = "results.json"
          print(f"Mode: {mode} → writing combined results to {out_filename}")

          # Map of shard tag -> output results dir
          categories = {
              "avm1": "ruffle-tests/tests/swfs/avm1/_results",
              "avm2": "ruffle-tests/tests/swfs/avm2/_results",
              "avmplus": "ruffle-tests/tests/swfs/from_avmplus/_results",
              "misc_timeline": "ruffle-tests/tests/swfs/timeline/_results",
              "misc_text": "ruffle-tests/tests/swfs/text/_results",
              "misc_swf": "ruffle-tests/tests/swfs/swf/_results",
              "misc_import_assets": "ruffle-tests/tests/swfs/import_assets/_results",
              "misc_audio": "ruffle-tests/tests/swfs/audio/_results",
              "misc_fonts": "ruffle-tests/tests/swfs/fonts/_results",
              "misc_visual": "ruffle-tests/tests/swfs/visual/_results",
              "misc_mixed_avm": "ruffle-tests/tests/swfs/mixed_avm/_results",
              "misc_stage3d": "ruffle-tests/tests/swfs/stage3d/_results",
              "regression": "ruffle-tests/tests/swfs/regression/_results",
              "shumway_avm1": "ruffle-tests/tests/swfs/from_shumway/avm1/_results",
              "shumway_flat": "ruffle-tests/tests/swfs/from_shumway/_results",
              "gnash_swfmill": "ruffle-tests/tests/swfs/from_gnash/misc-swfmill.all/_results",
              "gnash_as": "ruffle-tests/tests/swfs/from_gnash/actionscript.all/_results",
              "gnash_mtasc": "ruffle-tests/tests/swfs/from_gnash/misc-mtasc.all/_results",
              "gnash_ming": "ruffle-tests/tests/swfs/from_gnash/misc-ming.all/_results",
              "gnash_swfc": "ruffle-tests/tests/swfs/from_gnash/misc-swfc.all/_results",
          }

          # A run that lost a shard produces a results file that is *valid* but
          # short. metadata.incomplete records that, but a `::warning::` alone
          # left the run green — and a green run whose numbers are quietly
          # missing 139 tests is the single most expensive failure mode we
          # have had. Collect them and fail the job at the end, AFTER every
          # results file is written (all downstream steps are `if: always()`,
          # so the labelled partial results still publish).
          incomplete = []
          written_suites = []

          for tag, out_dir in categories.items():
              pattern = f"artifacts/results-shard-*/results-shard-{tag}-*.json"
              files = sorted(glob.glob(pattern))
              if not files:
                  print(f"{tag}: no shard files found, skipping")
                  continue

              actual_shards = len(files)
              missing_shards = max(0, expected_shards - actual_shards) if expected_shards > 0 else 0
              if missing_shards > 0:
                  print(f"::error::{tag}: only {actual_shards}/{expected_shards} shards produced results ({missing_shards} missing)")
                  incomplete.append(f"{tag} ({actual_shards}/{expected_shards} shards)")
              print(f"{tag}: combining {actual_shards} shard files")

              combined_tests = []
              total_duration = 0
              total_available = 0
              git_sha = None
              breakdown = {}
              pass_count = 0
              ruffle_matched_count = 0
              interrupted_shards = 0

              for f in files:
                  with open(f) as fp:
                      data = json.load(fp)
                  combined_tests.extend(data.get("tests", []))
                  m = data.get("metadata", {})
                  total_duration += m.get("duration_seconds", 0)
                  total_available = max(total_available, m.get("total_available", 0))
                  if not git_sha:
                      git_sha = m.get("git_sha")
                  pass_count += data.get("pass", 0)
                  ruffle_matched_count += data.get("ruffle_matched", 0)
                  for k, v in data.get("breakdown", {}).items():
                      breakdown[k] = breakdown.get(k, 0) + v
                  if m.get("interrupted"):
                      interrupted_shards += 1

              # ruffle_matched lives in the shard breakdowns as an info entry —
              # strip it here because the combined report surfaces it as a
              # dedicated top-level field and the "breakdown" section is
              # reserved for genuine failure categories.
              breakdown.pop("ruffle_matched", None)

              total = len(combined_tests)
              effective_pass = pass_count + ruffle_matched_count
              metadata = {
                  "timestamp": datetime.now(timezone.utc).isoformat(),
                  "git_sha": git_sha,
                  "duration_seconds": round(total_duration, 2),
                  "total_available": total_available,
                  "shards": actual_shards,
              }
              if expected_shards > 0:
                  metadata["expected_shards"] = expected_shards
              if missing_shards > 0:
                  metadata["missing_shards"] = missing_shards
                  metadata["incomplete"] = True
              if interrupted_shards > 0:
                  metadata["interrupted_shards"] = interrupted_shards
                  metadata["incomplete"] = True
                  print(f"::error::{tag}: {interrupted_shards} shard(s) were interrupted (partial results)")
                  incomplete.append(f"{tag} ({interrupted_shards} interrupted)")

              report = {
                  "metadata": metadata,
                  "total": total,
                  "pass": pass_count,
                  "ruffle_matched": ruffle_matched_count,
                  "fail": total - effective_pass,
                  "pass_rate": round(100 * pass_count / total, 1) if total else 0,
                  "effective_pass": effective_pass,
                  "effective_pass_rate": round(100 * effective_pass / total, 1) if total else 0,
                  "breakdown": {k: v for k, v in breakdown.items() if v},
                  "tests": sorted(combined_tests, key=lambda t: t["test"]),
              }

              os.makedirs(out_dir, exist_ok=True)
              with open(f"{out_dir}/{out_filename}", "w") as fp:
                  json.dump(report, fp, indent=2)
              # Record that THIS run produced this suite's results. The image
              # report reads it so a `categories=avm1` run does not rebuild
              # (and republish) image results for avm2 et al. from the master
              # checkout's copy of results_graphics.json, which is only as
              # fresh as the last results merge.
              written_suites.append(
                  out_dir.replace("ruffle-tests/tests/swfs/", "").replace("/_results", ""))

              suffix = f" — INCOMPLETE ({missing_shards} shards missing)" if missing_shards > 0 else ""
              if ruffle_matched_count:
                  print(f"  {pass_count}/{total} passing ({report['pass_rate']}%),"
                        f" +{ruffle_matched_count} ruffle_matched →"
                        f" {effective_pass}/{total} effective ({report['effective_pass_rate']}%){suffix}")
              else:
                  print(f"  {pass_count}/{total} passing ({report['pass_rate']}%){suffix}")

          with open("image_suites.txt", "w") as fp:
              fp.write("\n".join(written_suites) + "\n")

          if incomplete:
              print()
              print("::error::INCOMPLETE RUN — do not read these numbers as a baseline.")
              for item in incomplete:
                  print(f"::error::  {item}")
              print("::error::The results files ARE published and carry "
                    "metadata.incomplete=true; scripts/corpus_status_diff.py "
                    "will refuse to treat the missing tests as regressions. "
                    "Re-run the failed shards (`gh run rerun <id> --failed`) "
                    "before quoting a corpus total.")
              raise SystemExit(1)
          EOF

      # --- Image-comparison instrument (images=true only) ---
      #
      # The image VERDICTS already ride inside each suite's results JSON (one
      # `image_comparisons` block per test entry) and were merged by the step
      # above along with everything else — no separate shard JSON exists or is
      # needed. What these steps add is the flat per-suite instrument file, and
      # the failing PNGs.
      - name: Download failing image PNGs
        if: always() && inputs.images == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: image-shard-*
          path: ${{ runner.temp }}/image-artifacts
          merge-multiple: true

      - name: Build per-suite image results
        if: always() && inputs.images == 'true'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            graphics) STEM=results_graphics ;;
            *)        STEM=results ;;
          esac
          # Coverage audit first, against the tree CI actually graded (the
          # test SWFs are re-downloaded fresh every run, so this catches an
          # upstream test added since the last local sync). Deliberately does
          # not fail the job: three regression tests legitimately ship no
          # expected PNG, and a missing one is recorded as an explicit
          # skip/no_expected_image row rather than vanishing.
          python3 scripts/build_image_report.py --audit
          python3 scripts/build_image_report.py --stem="$STEM" \
            --suites-file=image_suites.txt

      # Force-pushes a single commit to ruffle-image-results. Must run BEFORE
      # the results publish below: that script switches the work tree onto the
      # ruffle-test-results branch, which would take scripts/ and the results
      # JSONs this one reads out from under it.
      - name: Publish failing images to ruffle-image-results
        if: always() && inputs.images == 'true' && inputs.extra_defines == '' && inputs.try_helper == '' && inputs.tu_split == '' && inputs.skip_avm1_payload == ''
        env:
          IMAGE_SRC: ${{ runner.temp }}/image-artifacts
          STEM: ${{ inputs.mode == 'graphics' && 'results_graphics' || 'results' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish_images.sh

      - name: Verify Flash-spec expected output
        if: always()
        env:
          TZ: NPT-5:45
        run: |
          # Always no-graphics, regardless of `mode`. These are the three
          # avm1 trace tests that ship an output.flash.txt (Flash's real
          # behavior, where Ruffle's output.txt encodes Ruffle's own); the
          # graphics build would produce identical trace output. More to the
          # point, results_flash.json has no per-mode stem, so running it
          # under two modes would have them overwrite each other — and the
          # combine-results job (the path every sharded run takes) has no
          # Dawn install, so at mode=graphics this step aborted instantly
          # with "Dawn library not found" and produced nothing at all.
          echo "=== Running Flash-spec tests (output.flash.txt) ==="
          python3 ruffle-tests/verify_output.py -v \
            --mode=no-graphics \
            --expected-suffix=flash || true

      - name: ccache stats
        if: always()
        run: ccache -s

      # Filter / diff / markdown / index generation moved to the "Commit
      # results" step below so it runs AFTER the branch switch to
      # ruffle-test-results. That way the .md files reflect the merged
      # state (this run's results + previous runs' inherited results)
      # rather than master's potentially-stale snapshot.

      - name: Generate step summary
        if: always()
        run: |
          python3 << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, glob, os
          print("## Ruffle Test Results\n")
          for rj in sorted(glob.glob("ruffle-tests/tests/swfs/**/_results/results.json", recursive=True)):
              with open(rj) as f:
                  r = json.load(f)
              cat = os.path.dirname(rj).replace("ruffle-tests/tests/swfs/", "").replace("/_results", "")
              m = r.get("metadata", {})
              fj = os.path.join(os.path.dirname(rj), "results_filtered.json")
              try:
                  with open(fj) as f:
                      rf = json.load(f)
                  ignored = rf["metadata"].get("ignored_count", 0)
                  rf_rm = rf.get("ruffle_matched", 0)
                  rf_eff = rf.get("effective_pass", rf["pass"])
                  rf_eff_rate = rf.get("effective_pass_rate", rf["pass_rate"])
                  r_rm = r.get("ruffle_matched", 0)
                  print(f"### {cat}")
                  if rf_rm:
                      print(f"**{rf_eff}/{rf['total']}** effective ({rf_eff_rate}%)"
                            f" = {rf['pass']} pass + {rf_rm} ruffle_matched — filtered")
                  else:
                      print(f"**{rf['pass']}/{rf['total']}** passing ({rf['pass_rate']}%) — filtered")
                  if r_rm:
                      print(f"({r['pass']}+{r_rm} rm / {r['total']} raw, {ignored} ignored)\n")
                  else:
                      print(f"({r['pass']}/{r['total']} raw, {ignored} ignored)\n")
              except FileNotFoundError:
                  r_rm = r.get("ruffle_matched", 0)
                  print(f"### {cat}")
                  if r_rm:
                      r_eff = r.get("effective_pass", r["pass"])
                      r_eff_rate = r.get("effective_pass_rate", r["pass_rate"])
                      print(f"**{r_eff}/{r['total']}** effective ({r_eff_rate}%)"
                            f" = {r['pass']} pass + {r_rm} ruffle_matched\n")
                  else:
                      print(f"**{r['pass']}/{r['total']}** passing ({r['pass_rate']}%)\n")
              if m.get("incomplete"):
                  ms = m.get("missing_shards", 0)
                  es = m.get("expected_shards", 0)
                  print(f"> **⚠️ Incomplete: {es - ms}/{es} shards produced results ({ms} missing)**\n")
              if m.get("git_sha"):
                  print(f"Commit: `{m['git_sha'][:12]}`")
              if m.get("duration_seconds"):
                  dur = m['duration_seconds']
                  shards = m.get('shards', 1)
                  print(f"Duration: {dur:.0f}s total across {shards} shard(s)")
              print()
          PYEOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruffle-test-results
          path: |
            ruffle-tests/tests/swfs/**/_results/
            RUFFLE_RESULTS.md
            RUFFLE_RESULTS_FILTERED.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit results to ruffle-test-results branch
        # NEVER publish results from an extra-defines build. The result-JSON
        # stem is chosen by `mode` alone, so a verify run (e.g.
        # -DAVM2_SLOT_VERIFY at mode=no-graphics) writes the SAME
        # results.json as a normal no-graphics run and force-pushes it to
        # ruffle-test-results. That branch is what the NEXT run fetches as
        # {STEM}_previous.json, so verify-build numbers silently become the
        # baseline a later normal run diffs against — phantom regressions
        # with no code change behind them. A verify run's value is its
        # pass/fail signal, not its numbers; the JSONs remain available as
        # workflow artifacts either way.
        #
        # The same reasoning covers `single_test`, which used to satisfy this
        # guard and publish. A single-test run rebuilds the results tree from
        # the MASTER CHECKOUT with one test patched in, so dispatching one
        # before pushing a results merge force-pushed a pre-merge tree over
        # the branch and erased an arc's published numbers (run 30186909756,
        # 2026-07-26). Its value is the per-test verdict in the log and the
        # uploaded artifact — never the branch.
        # try_helper, tu_split and skip_avm1_payload likewise: a forced-on
        # emission run's value is its pass/fail signal, not its numbers —
        # publishing them would poison the {STEM}_previous.json baseline the
        # NEXT (default-emission) run diffs against, exactly as the
        # extra_defines verify runs used to.
        if: always() && inputs.extra_defines == '' && inputs.single_test == '' && inputs.try_helper == '' && inputs.tu_split == '' && inputs.skip_avm1_payload == ''
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          IMAGES: ${{ inputs.images }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Run from a copy outside the work tree: the script switches branches,
        # so the on-disk scripts/ci/publish_results.sh is replaced (or removed)
        # while bash is still reading it.
        run: |
          cp scripts/ci/publish_results.sh "$RUNNER_TEMP/publish_results.sh"
          bash "$RUNNER_TEMP/publish_results.sh"

      - name: Prune old ccache entries
        # Defense-in-depth against the per-repo 10 GiB cache cap. With the
        # shared per-mode ccache key a run now produces ~1 entry per mode
        # (was ~30 per shard per mode), but stale entries from prior runs and
        # the old per-shard keys still accumulate. Keep the 2 most recent
        # entries per cache-key prefix; delete the rest so the Dawn cache
        # (small, refreshed only on graphics runs) is never LRU-evicted.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          to_delete=$(gh cache list --limit 500 --order desc --sort created_at \
            --json id,key | \
            jq -r '
              [.[] | select(.key | startswith("ccache-ruffle-")) |
                {id: .id, prefix: (.key | sub("-[0-9]+$"; ""))}] |
              group_by(.prefix) |
              map(.[2:]) |
              flatten |
              .[].id
            ')
          if [ -z "$to_delete" ]; then
            echo "No old ccache entries to prune."
            exit 0
          fi
          echo "$to_delete" | while read -r id; do
            [ -z "$id" ] && continue
            echo "Pruning ccache id=$id"
            gh cache delete "$id" || true
          done

  # --- WASM link-smoke (compile+link only) ---
  # Neither WASM build mode has behavioural CI, and both silently rotted while
  # the Ruffle suite stayed green: the browser-WASM graphics link broke at
  # 2f20b1c59 (fixed 367c9b1e5) and the trace-WASM build rotted from ~mid-June
  # (fixed 903b88c8a). This job compiles AND links one small git-tracked demo in
  # each mode on every dispatch, so a runtime change that breaks either WASM
  # link turns the run red. It is COMPILE+LINK ONLY — no browser, no execution
  # (headless browser testing is a separate, rejected-for-now project; see
  # SWFRecompDocs/plans/browser-wasm-testing-plan.md). Mode-independent: runs
  # regardless of the mode / parallel / single_test inputs, as its own named
  # job so a smoke failure is visible on its own, not buried in a shard.
  wasm-link-smoke:
    name: WASM link-smoke
    runs-on: ubuntu-latest

    env:
      # Pin emsdk to the version used locally so the emdawnwebgpu port (pulled
      # by the graphics build via --use-port=emdawnwebgpu) is always available.
      EMSDK_VERSION: '5.0.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install system dependencies
        # swfmill: the graphics smoke's test.swf is gitignored and regenerated
        # from its tracked create_test_swf.py, which shells out to swfmill.
        # (The trace smoke's SWF generator is pure-Python, no swfmill needed.)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake swfmill

      # Cache the whole emsdk tree (SDK + toolchain + the emscripten ports/cache
      # dir under emsdk/upstream/emscripten/cache, which is where the
      # emdawnwebgpu port lands on first graphics build). One stable entry keyed
      # on the pinned version — it never churns, so it won't LRU-evict the Dawn
      # cache. On a miss the clone+install+activate + first port download runs
      # inline (~few min, cold); on a hit the job is warm (< ~5 min target).
      - name: Restore emsdk cache
        id: emsdk_cache
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-wasm-smoke-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Set up emsdk (cache miss)
        if: steps.emsdk_cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git emsdk
          cd emsdk
          ./emsdk install "${EMSDK_VERSION}"
          ./emsdk activate "${EMSDK_VERSION}"

      - name: Build SWFRecomp
        run: |
          mkdir -p SWFRecomp/build
          cd SWFRecomp/build
          cmake ..
          make -j$(nproc)

      - name: Trace-WASM link smoke (swf_core.c / NO_GRAPHICS)
        # build_test.sh auto-generates test.swf, runs the recompiler, and
        # compiles+links with emcc; set -e makes an emcc link failure exit
        # non-zero (which fails this step).
        run: |
          source emsdk/emsdk_env.sh
          bash SWFRecomp/scripts/build_test.sh trace_swf_4 wasm

      - name: Browser-WASM graphics link smoke (swf.c / USE_WEBGPU)
        # First graphics build downloads the emdawnwebgpu port into the emsdk
        # cache dir (captured by the emsdk cache above on a cold run).
        run: |
          source emsdk/emsdk_env.sh
          bash SWFRecomp/scripts/build_test.sh graphics/three_boxes wasm --graphics

      - name: Verify link artifacts exist
        run: |
          set -eu
          fail=0
          check() {
            local label="$1" f="$2"
            if [ -s "$f" ]; then
              echo "  ✅ ${label}: $f ($(wc -c < "$f") bytes)"
            else
              echo "::error::${label} link artifact missing or empty: $f"
              fail=1
            fi
          }
          echo "## WASM link-smoke" >> "$GITHUB_STEP_SUMMARY"
          T_JS=SWFRecomp/tests/trace_swf_4/build/wasm/trace_swf_4.js
          T_WASM=SWFRecomp/tests/trace_swf_4/build/wasm/trace_swf_4.wasm
          G_JS=SWFRecomp/tests/graphics/three_boxes/build/wasm/three_boxes.js
          G_WASM=SWFRecomp/tests/graphics/three_boxes/build/wasm/three_boxes.wasm
          echo "### Trace-WASM (swf_core.c)"
          check "trace .js" "$T_JS"
          check "trace .wasm" "$T_WASM"
          echo "### Browser-WASM graphics (swf.c)"
          check "graphics .js" "$G_JS"
          check "graphics .wasm" "$G_WASM"
          if [ "$fail" = 0 ]; then
            echo "Both WASM build modes linked cleanly. ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ One or more WASM link artifacts were missing — see job log." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
