name: Ruffle Tests

on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Test categories to run'
        required: true
        type: choice
        options:
          - 'all'
          - 'no_gnash'
          - 'avm1'
          - 'from_shumway'
          - 'from_gnash'
        default: 'all'
      limit:
        description: 'Max tests per category (0 = all)'
        required: false
        default: '0'
        type: string
      parallel:
        description: 'Number of parallel runners'
        required: true
        type: choice
        options:
          - '1'
          - '10'
          - '20'
          - '30'
        default: '30'
      mode:
        description: 'Build mode (graphics modes need Dawn prebuilt — see workflow comment)'
        required: true
        type: choice
        options:
          - 'no-graphics'
          - 'graphics'
          - 'graphics-headless-legacy'
        default: 'no-graphics'
      single_test:
        description: 'Run a single test by name (overrides categories; auto-uses single runner)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      categories:
        description: 'Test categories to run'
        required: false
        default: 'all'
        type: string
      limit:
        description: 'Max tests per category (0 = all)'
        required: false
        default: '0'
        type: string
      parallel:
        description: 'Number of parallel runners'
        required: false
        default: '30'
        type: string
      mode:
        description: 'Build mode (no-graphics | graphics | graphics-headless-legacy)'
        required: false
        default: 'no-graphics'
        type: string
      single_test:
        description: 'Run a single test by name'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write   # for `gh cache delete` in the prune-old-ccache step

# All test directories and their results locations.
# When adding a new category, add it here, to the DIRS lists below, and to
# the shard combine script's categories dict.
env:
  AVM1_DIR: ruffle-tests/tests/swfs/avm1
  SHUMWAY_AVM1_DIR: ruffle-tests/tests/swfs/from_shumway/avm1
  SHUMWAY_FLAT_DIR: ruffle-tests/tests/swfs/from_shumway
  GNASH_SWFMILL_DIR: ruffle-tests/tests/swfs/from_gnash/misc-swfmill.all
  GNASH_AS_DIR: ruffle-tests/tests/swfs/from_gnash/actionscript.all
  GNASH_MTASC_DIR: ruffle-tests/tests/swfs/from_gnash/misc-mtasc.all
  GNASH_MING_DIR: ruffle-tests/tests/swfs/from_gnash/misc-ming.all
  GNASH_SWFC_DIR: ruffle-tests/tests/swfs/from_gnash/misc-swfc.all

jobs:
  # --- Single runner path ---
  ruffle-tests:
    name: Run Tests
    if: inputs.parallel == '1' || inputs.single_test != ''
    runs-on: ubuntu-latest

    env:
      RUN_AVM1: ${{ inputs.categories == 'all' || inputs.categories == 'no_gnash' || inputs.categories == 'avm1' }}
      RUN_SHUMWAY: ${{ inputs.categories == 'all' || inputs.categories == 'no_gnash' || inputs.categories == 'from_shumway' }}
      RUN_GNASH: ${{ inputs.categories == 'all' || inputs.categories == 'from_gnash' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip Pillow

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ccache

      # Graphics modes (graphics, graphics-headless-legacy) need Vulkan +
      # a prebuilt Dawn library. Dawn is built by .github/workflows/build-dawn.yml
      # and stored in the GitHub Actions cache. If the cache is missing
      # (first run on a new ref or post-eviction), trigger build-dawn.yml
      # manually first: `gh workflow run build-dawn.yml`.
      - name: Compute Dawn cache key
        if: inputs.mode != 'no-graphics'
        id: dawn_key
        run: |
          script_hash=$(sha256sum scripts/build_dawn.sh | cut -c1-16)
          # The cache_schema 'v1' must match the default in build-dawn.yml.
          # If you bump it there, bump it here too.
          key="dawn-prebuilt-linux-x64-${script_hash}-v1"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore-or-save Dawn cache
        if: inputs.mode != 'no-graphics'
        id: dawn_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dawn-install
          key: ${{ steps.dawn_key.outputs.key }}

      - name: Install Dawn build dependencies (cache miss)
        if: inputs.mode != 'no-graphics' && steps.dawn_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y git ninja-build python3

      - name: Build Dawn (cache miss)
        if: inputs.mode != 'no-graphics' && steps.dawn_cache.outputs.cache-hit != 'true'
        run: |
          echo "::notice::Dawn cache miss — building inline (~30 min). actions/cache@v4 will save the result automatically."
          bash scripts/build_dawn.sh "${RUNNER_TEMP}/dawn-install"

      - name: Install Vulkan + libavcodec
        if: inputs.mode != 'no-graphics'
        run: |
          # libav* are needed by SWFModernRuntime's video codec backend
          # (SWFRecompDocs/plans/video-codec-support-plan.md). verify_output.py
          # probes pkg-config in graphics modes and defines SWF_HAVE_LIBAVCODEC
          # when found; absent, only ScreenVideo (FLV codec 3) decodes.
          sudo apt-get install -y \
            mesa-vulkan-drivers vulkan-tools libvulkan1 \
            libavcodec-dev libavutil-dev libswscale-dev
          {
            echo "DAWN_INSTALL=$RUNNER_TEMP/dawn-install"
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json"
            echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json"
          } >> "$GITHUB_ENV"

      - name: Pin ccache directory
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ruffle-single-${{ inputs.mode }}-${{ github.run_id }}
          restore-keys: |
            ccache-ruffle-single-${{ inputs.mode }}-
            ccache-ruffle-single-

      - name: Configure ccache
        run: |
          # Cap each cache entry at 200 MiB. With ~30 shards each saving up
          # to this much, total ccache usage stays under 6 GiB and leaves
          # room for the Dawn cache (~few hundred MiB) under the 10 GiB
          # per-repo limit. Larger values trigger eviction storms that drop
          # the Dawn cache.
          ccache --max-size=200M
          ccache -z

      - name: Build SWFRecomp
        run: |
          mkdir -p SWFRecomp/build
          cd SWFRecomp/build
          cmake ..
          make -j$(nproc)

      - name: Download Ruffle test SWFs
        run: |
          CATS=""
          [ "$RUN_AVM1" = "true" ] && CATS="$CATS avm1"
          [ "$RUN_SHUMWAY" = "true" ] && CATS="$CATS from_shumway"
          [ "$RUN_GNASH" = "true" ] && CATS="$CATS from_gnash"
          bash ruffle-tests/download_tests.sh $CATS

      - name: Run recompiler on test SWFs
        run: |
          DIRS=""
          [ "$RUN_AVM1" = "true" ] && DIRS="$DIRS $AVM1_DIR"
          if [ "$RUN_SHUMWAY" = "true" ]; then
            DIRS="$DIRS $SHUMWAY_AVM1_DIR $SHUMWAY_FLAT_DIR"
          fi
          [ "$RUN_GNASH" = "true" ] && DIRS="$DIRS $GNASH_SWFMILL_DIR $GNASH_AS_DIR $GNASH_MTASC_DIR $GNASH_MING_DIR $GNASH_SWFC_DIR"
          for dir in $DIRS; do
            [ -d "$dir" ] && python3 ruffle-tests/run_tests.py --tests-dir="$dir" || true
          done

      - name: Fetch previous results
        run: |
          DIRS=""
          [ "$RUN_AVM1" = "true" ] && DIRS="$DIRS $AVM1_DIR"
          if [ "$RUN_SHUMWAY" = "true" ]; then
            DIRS="$DIRS $SHUMWAY_AVM1_DIR $SHUMWAY_FLAT_DIR"
          fi
          [ "$RUN_GNASH" = "true" ] && DIRS="$DIRS $GNASH_SWFMILL_DIR $GNASH_AS_DIR $GNASH_MTASC_DIR $GNASH_MING_DIR $GNASH_SWFC_DIR"
          # Per-mode previous baseline: graphics runs diff against the last
          # graphics run, headless against the last headless run, etc. The
          # commit step generates the actual diff after the branch switch.
          case "${{ inputs.mode }}" in
            graphics) PREV_STEM="results_graphics" ;;
            graphics-headless-legacy) PREV_STEM="results_headless" ;;
            *) PREV_STEM="results" ;;
          esac
          if git fetch origin ruffle-test-results 2>/dev/null; then
            for dir in $DIRS; do
              mkdir -p "$dir/_results"
              git show "origin/ruffle-test-results:$dir/_results/${PREV_STEM}.json" \
                > "$dir/_results/${PREV_STEM}_previous.json" 2>/dev/null || true
            done
          fi

      - name: Verify single test
        if: inputs.single_test != ''
        env:
          TZ: NPT-5:45
        run: |
          echo "=== Running single test: ${{ inputs.single_test }} (mode=${{ inputs.mode }}) ==="
          python3 ruffle-tests/verify_output.py -v \
            --test='${{ inputs.single_test }}' \
            --mode='${{ inputs.mode }}' \
            --diff

      - name: Verify runtime output
        if: inputs.single_test == ''
        env:
          TZ: NPT-5:45
        run: |
          DIRS=""
          [ "$RUN_AVM1" = "true" ] && DIRS="$DIRS $AVM1_DIR"
          if [ "$RUN_SHUMWAY" = "true" ]; then
            DIRS="$DIRS $SHUMWAY_AVM1_DIR $SHUMWAY_FLAT_DIR"
          fi
          [ "$RUN_GNASH" = "true" ] && DIRS="$DIRS $GNASH_SWFMILL_DIR $GNASH_AS_DIR $GNASH_MTASC_DIR $GNASH_MING_DIR $GNASH_SWFC_DIR"
          LIMIT_ARGS=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARGS="--limit=${{ inputs.limit }}"
          fi
          for dir in $DIRS; do
            [ -d "$dir" ] || continue
            echo "=== Running: $dir ==="
            python3 ruffle-tests/verify_output.py -v --tests-dir="$dir" \
              --mode='${{ inputs.mode }}' $LIMIT_ARGS || true
          done

      - name: Verify Flash-spec expected output
        if: always() && inputs.single_test == '' && (env.RUN_AVM1 == 'true')
        env:
          TZ: NPT-5:45
        run: |
          echo "=== Running Flash-spec tests (output.flash.txt) ==="
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --expected-suffix=flash || true

      - name: ccache stats
        if: always()
        run: ccache -s

      # Filter / diff / markdown / index generation moved to the "Commit
      # results" step below so it runs AFTER the branch switch to
      # ruffle-test-results. That way the .md files reflect the merged
      # state (this run's results + previous runs' inherited results)
      # rather than master's potentially-stale snapshot.

      - name: Generate step summary
        if: always()
        run: |
          python3 << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, glob, os
          print("## Ruffle Test Results\n")
          for rj in sorted(glob.glob("ruffle-tests/tests/swfs/**/_results/results.json", recursive=True)):
              with open(rj) as f:
                  r = json.load(f)
              cat = os.path.dirname(rj).replace("ruffle-tests/tests/swfs/", "").replace("/_results", "")
              m = r.get("metadata", {})
              fj = os.path.join(os.path.dirname(rj), "results_filtered.json")
              try:
                  with open(fj) as f:
                      rf = json.load(f)
                  ignored = rf["metadata"].get("ignored_count", 0)
                  rf_rm = rf.get("ruffle_matched", 0)
                  rf_eff = rf.get("effective_pass", rf["pass"])
                  rf_eff_rate = rf.get("effective_pass_rate", rf["pass_rate"])
                  r_rm = r.get("ruffle_matched", 0)
                  print(f"### {cat}")
                  if rf_rm:
                      print(f"**{rf_eff}/{rf['total']}** effective ({rf_eff_rate}%)"
                            f" = {rf['pass']} pass + {rf_rm} ruffle_matched — filtered")
                  else:
                      print(f"**{rf['pass']}/{rf['total']}** passing ({rf['pass_rate']}%) — filtered")
                  if r_rm:
                      print(f"({r['pass']}+{r_rm} rm / {r['total']} raw, {ignored} ignored)\n")
                  else:
                      print(f"({r['pass']}/{r['total']} raw, {ignored} ignored)\n")
              except FileNotFoundError:
                  r_rm = r.get("ruffle_matched", 0)
                  print(f"### {cat}")
                  if r_rm:
                      r_eff = r.get("effective_pass", r["pass"])
                      r_eff_rate = r.get("effective_pass_rate", r["pass_rate"])
                      print(f"**{r_eff}/{r['total']}** effective ({r_eff_rate}%)"
                            f" = {r['pass']} pass + {r_rm} ruffle_matched\n")
                  else:
                      print(f"**{r['pass']}/{r['total']}** passing ({r['pass_rate']}%)\n")
              if m.get("git_sha"):
                  print(f"Commit: `{m['git_sha'][:12]}`")
              if r.get("breakdown"):
                  print("| Category | Count |")
                  print("|----------|------:|")
                  print(f"| Pass | {r['pass']} |")
                  for k, v in r["breakdown"].items():
                      print(f"| {k} | {v} |")
              print()
          PYEOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruffle-test-results
          path: |
            ruffle-tests/tests/swfs/**/_results/
            RUFFLE_RESULTS.md
            RUFFLE_RESULTS_FILTERED.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit results to ruffle-test-results branch
        if: always()
        run: |
          # Per-mode result-JSON stem. Each CI run produces a fresh
          # {STEM}.json plus a fetched {STEM}_previous.json; everything else
          # (filter / diff / markdown / index) is regenerated below against
          # the merged ruffle-test-results state so the committed reports
          # cover ALL modes consistently — not just the one we just ran.
          case "${{ inputs.mode }}" in
            graphics) STEM="results_graphics" ;;
            graphics-headless-legacy) STEM="results_headless" ;;
            *) STEM="results" ;;
          esac

          if ! find ruffle-tests/tests/swfs -path "*/_results/${STEM}.json" 2>/dev/null | grep -q .; then
            echo "No ${STEM}.json files to commit (mode=${{ inputs.mode }})"
            exit 0
          fi

          # Save this run's JSON outputs to /tmp before the branch switch
          # (the JSONs are this run's only unique contribution — everything
          # else gets regenerated from the merged state).
          find ruffle-tests/tests/swfs -path '*/_results' -type d | while read dir; do
            for name in "${STEM}.json" "${STEM}_previous.json"; do
              if [ -f "$dir/$name" ]; then
                mkdir -p "/tmp/results_backup/$dir"
                cp "$dir/$name" "/tmp/results_backup/$dir/"
              fi
            done
          done
          # Also stash the post-processing scripts so they survive the branch
          # switch even if origin/ruffle-test-results lags master.
          mkdir -p /tmp/scripts_backup
          cp -r scripts /tmp/scripts_backup/ 2>/dev/null || true
          mkdir -p /tmp/scripts_backup/ruffle-tests
          cp ruffle-tests/filter_results.py /tmp/scripts_backup/ruffle-tests/ 2>/dev/null || true
          cp ruffle-tests/ignored_tests.txt /tmp/scripts_backup/ruffle-tests/ 2>/dev/null || true
          # Per-suite ignore lists live alongside each suite directory.
          # Back them up so the filter step sees master's versions instead
          # of the (stale) copies inherited from the ruffle-test-results
          # branch — otherwise per-suite ignored_tests.txt edits on master
          # never reach filter_results.py.
          find ruffle-tests/tests/swfs -name ignored_tests.txt -print0 2>/dev/null | \
            while IFS= read -r -d '' f; do
              mkdir -p "/tmp/scripts_backup/$(dirname "$f")"
              cp "$f" "/tmp/scripts_backup/$f"
            done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

          # Discard working tree so we can switch branches cleanly. Files
          # we need are already in /tmp.
          git reset --hard HEAD
          # Also delete untracked `*_previous.json` files written by the
          # "Fetch previous results" step. They're untracked on master but
          # tracked on ruffle-test-results, so the checkout below would
          # refuse with "untracked working tree files would be overwritten".
          # The ones we need are already saved to /tmp/results_backup.
          find ruffle-tests/tests/swfs -path '*/_results/*_previous.json' -delete 2>/dev/null || true

          # Inherit from existing ruffle-test-results so prior runs' results
          # (in any mode) are preserved. Falls back to current HEAD if the
          # branch doesn't exist yet (first-ever push).
          if git show-ref --verify --quiet refs/remotes/origin/ruffle-test-results; then
            git checkout -B ruffle-test-results origin/ruffle-test-results
          else
            git checkout -B ruffle-test-results
          fi

          # Remove stale files from old workflow layout
          for f in ruffle-results.md ruffle-results-diff.md ruffle-results-filtered.md \
                   ruffle-results-headless.md ruffle-image-results.md \
                   ruffle-tests/results.json ruffle-tests/results_diff.json \
                   ruffle-tests/results_filtered.json ruffle-tests/image_results.json \
                   ruffle-tests/results-index.md test_results.json; do
            git rm -f "$f" 2>/dev/null || true
          done

          # Restore this mode's JSON outputs onto the inherited branch state.
          find /tmp/results_backup/ruffle-tests/tests/swfs -path '*/_results' -type d 2>/dev/null | while read dir; do
            real_dir="${dir#/tmp/results_backup/}"
            mkdir -p "$real_dir"
            cp "$dir"/* "$real_dir/" 2>/dev/null || true
          done

          # Restore scripts in case origin/ruffle-test-results lacks newer
          # versions (the user merges results back periodically; in between,
          # ruffle-test-results may lag master on script changes).
          if [ -d /tmp/scripts_backup/scripts ]; then
            cp -r /tmp/scripts_backup/scripts/* scripts/ 2>/dev/null || true
          fi
          if [ -f /tmp/scripts_backup/ruffle-tests/filter_results.py ]; then
            cp /tmp/scripts_backup/ruffle-tests/filter_results.py ruffle-tests/
          fi
          if [ -f /tmp/scripts_backup/ruffle-tests/ignored_tests.txt ]; then
            cp /tmp/scripts_backup/ruffle-tests/ignored_tests.txt ruffle-tests/
          fi
          # Restore per-suite ignore lists onto the ruffle-test-results
          # working tree (see the backup step above) so filter_results.py
          # reads master's versions and the commit carries them forward.
          if [ -d /tmp/scripts_backup/ruffle-tests/tests/swfs ]; then
            find /tmp/scripts_backup/ruffle-tests/tests/swfs -name ignored_tests.txt -print0 2>/dev/null | \
              while IFS= read -r -d '' f; do
                dest="${f#/tmp/scripts_backup/}"
                mkdir -p "$(dirname "$dest")"
                cp "$f" "$dest"
              done
          fi

          # Regenerate filtered results for every mode JSON we now have.
          # filter_results.py derives the output name from the input stem
          # (results.json → results_filtered.json,
          #  results_graphics.json → results_graphics_filtered.json, etc.).
          for stem in results results_graphics results_headless; do
            find ruffle-tests/tests/swfs -path "*/_results/${stem}.json" | while read f; do
              python3 ruffle-tests/filter_results.py "$f" || true
            done
          done

          # Regenerate the per-mode diff report against this run's previous
          # baseline (fetched into ${STEM}_previous.json before tests ran
          # and carried over from /tmp).
          find ruffle-tests/tests/swfs -path "*/_results/${STEM}.json" | while read f; do
            dir=$(dirname "$f")
            if [ -f "$dir/${STEM}_previous.json" ]; then
              python3 scripts/diff_ruffle_results.py "$dir/${STEM}_previous.json" "$f" \
                --json="$dir/${STEM}_diff.json" --markdown="$dir/${STEM}_diff.md" || true
            fi
          done

          # Regenerate markdown reports + cross-suite index for every mode.
          python3 scripts/generate_ruffle_results_markdown.py --scan || true
          python3 scripts/generate_results_index.py || true

          find ruffle-tests/tests/swfs -path '*/_results/*.json' -o -path '*/_results/*.md' | xargs git add -f 2>/dev/null || true
          git add -f RUFFLE_RESULTS*.md 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          LIMIT_MSG=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_MSG=" (limit=${{ inputs.limit }})"
          fi
          MODE_MSG=""
          if [ "${{ inputs.mode }}" != "no-graphics" ]; then
            MODE_MSG=" (mode=${{ inputs.mode }})"
          fi

          git commit -m "Update Ruffle test results${MODE_MSG}${LIMIT_MSG}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push -f origin ruffle-test-results

      - name: Prune old ccache entries
        # Defense-in-depth against the per-repo 10 GiB cache cap. Each run
        # produces ~30 ccache entries (~200 MiB each post-shrink), so caches
        # accumulate fast. Without pruning, older runs' caches push out the
        # Dawn cache (which is small and not refreshed every run). Keep the
        # 2 most recent entries per cache-key prefix; delete the rest.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # List ccache-ruffle-* entries newest-first, group by prefix
          # (key with trailing -<run_id> stripped), and emit IDs beyond the
          # first 2 in each group.
          to_delete=$(gh cache list --limit 500 --order desc --sort created_at \
            --json id,key | \
            jq -r '
              [.[] | select(.key | startswith("ccache-ruffle-")) |
                {id: .id, prefix: (.key | sub("-[0-9]+$"; ""))}] |
              group_by(.prefix) |
              map(.[2:]) |
              flatten |
              .[].id
            ')
          if [ -z "$to_delete" ]; then
            echo "No old ccache entries to prune."
            exit 0
          fi
          echo "$to_delete" | while read -r id; do
            [ -z "$id" ] && continue
            echo "Pruning ccache id=$id"
            gh cache delete "$id" || true
          done

  # --- Parallel runner path: shared setup ---
  setup-parallel:
    name: Setup (Build + Download + Recompile)
    if: inputs.parallel != '1' && inputs.single_test == ''
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      total: ${{ steps.matrix.outputs.total }}
      run_avm1: ${{ steps.cats.outputs.run_avm1 }}
      run_shumway: ${{ steps.cats.outputs.run_shumway }}
      run_gnash: ${{ steps.cats.outputs.run_gnash }}

    env:
      RUN_AVM1: ${{ inputs.categories == 'all' || inputs.categories == 'no_gnash' || inputs.categories == 'avm1' }}
      RUN_SHUMWAY: ${{ inputs.categories == 'all' || inputs.categories == 'no_gnash' || inputs.categories == 'from_shumway' }}
      RUN_GNASH: ${{ inputs.categories == 'all' || inputs.categories == 'from_gnash' }}

    steps:
      - name: Determine categories
        id: cats
        run: |
          echo "run_avm1=$RUN_AVM1" >> "$GITHUB_OUTPUT"
          echo "run_shumway=$RUN_SHUMWAY" >> "$GITHUB_OUTPUT"
          echo "run_gnash=$RUN_GNASH" >> "$GITHUB_OUTPUT"

      - name: Generate shard matrix
        id: matrix
        run: |
          N=${{ inputs.parallel }}
          echo "matrix=$(seq 1 $N | jq -cs '{shard: .}')" >> "$GITHUB_OUTPUT"
          echo "total=$N" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      # --- Dawn cache: restore-or-build, then save. Mirrors build-dawn.yml.
      # This populates the Dawn cache before any shards run, so shard-level
      # `cache/restore@v4` always hits. On miss this adds ~30 min to the
      # workflow (recovers the cache automatically); on hit it's ~30 sec.
      - name: Compute Dawn cache key
        if: inputs.mode != 'no-graphics'
        id: dawn_key
        run: |
          script_hash=$(sha256sum scripts/build_dawn.sh | cut -c1-16)
          # The cache_schema 'v1' must match the default in build-dawn.yml.
          key="dawn-prebuilt-linux-x64-${script_hash}-v1"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore-or-save Dawn cache
        if: inputs.mode != 'no-graphics'
        id: dawn_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dawn-install
          key: ${{ steps.dawn_key.outputs.key }}

      - name: Install Dawn build dependencies (cache miss)
        if: inputs.mode != 'no-graphics' && steps.dawn_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y git ninja-build python3

      - name: Build Dawn (cache miss)
        if: inputs.mode != 'no-graphics' && steps.dawn_cache.outputs.cache-hit != 'true'
        run: |
          echo "::notice::Dawn cache miss — building inline (~30 min). actions/cache@v4 will save the result automatically."
          bash scripts/build_dawn.sh "${RUNNER_TEMP}/dawn-install"

      - name: Build SWFRecomp
        run: |
          mkdir -p SWFRecomp/build
          cd SWFRecomp/build
          cmake ..
          make -j$(nproc)

      - name: Download Ruffle test SWFs
        run: |
          CATS=""
          [ "$RUN_AVM1" = "true" ] && CATS="$CATS avm1"
          [ "$RUN_SHUMWAY" = "true" ] && CATS="$CATS from_shumway"
          [ "$RUN_GNASH" = "true" ] && CATS="$CATS from_gnash"
          bash ruffle-tests/download_tests.sh $CATS

      - name: Run recompiler on test SWFs
        run: |
          DIRS=""
          [ "$RUN_AVM1" = "true" ] && DIRS="$DIRS $AVM1_DIR"
          if [ "$RUN_SHUMWAY" = "true" ]; then
            DIRS="$DIRS $SHUMWAY_AVM1_DIR $SHUMWAY_FLAT_DIR"
          fi
          [ "$RUN_GNASH" = "true" ] && DIRS="$DIRS $GNASH_SWFMILL_DIR $GNASH_AS_DIR $GNASH_MTASC_DIR $GNASH_MING_DIR $GNASH_SWFC_DIR"
          for dir in $DIRS; do
            [ -d "$dir" ] && python3 ruffle-tests/run_tests.py --tests-dir="$dir" || true
          done

      - name: Upload SWFRecomp binary
        uses: actions/upload-artifact@v7
        with:
          name: setup-binary
          path: SWFRecomp/build/SWFRecomp
          retention-days: 1

      - name: Upload recompiled test data
        uses: actions/upload-artifact@v7
        with:
          name: setup-tests
          path: ruffle-tests/
          retention-days: 1

  # --- Parallel runner path: shards ---
  ruffle-tests-shard:
    name: Shard ${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}
    if: inputs.parallel != '1' && inputs.single_test == ''
    needs: setup-parallel
    runs-on: ubuntu-latest

    env:
      RUN_AVM1: ${{ needs.setup-parallel.outputs.run_avm1 }}
      RUN_SHUMWAY: ${{ needs.setup-parallel.outputs.run_shumway }}
      RUN_GNASH: ${{ needs.setup-parallel.outputs.run_gnash }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-parallel.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip Pillow

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential ccache

      # Same Dawn cache restore as the single-runner job — see comment there.
      - name: Compute Dawn cache key
        if: inputs.mode != 'no-graphics'
        id: dawn_key
        run: |
          script_hash=$(sha256sum scripts/build_dawn.sh | cut -c1-16)
          key="dawn-prebuilt-linux-x64-${script_hash}-v1"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore Dawn from cache
        if: inputs.mode != 'no-graphics'
        id: dawn_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dawn-install
          key: ${{ steps.dawn_key.outputs.key }}

      - name: Install Vulkan + libavcodec + verify Dawn cache hit
        if: inputs.mode != 'no-graphics'
        run: |
          if [ "${{ steps.dawn_cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Dawn cache miss in shard. setup-parallel was supposed to populate it — investigate why this shard didn't see the cache."
            exit 1
          fi
          # libav* are needed by SWFModernRuntime's video codec backend
          # (see SWFRecompDocs/plans/video-codec-support-plan.md).
          sudo apt-get install -y \
            mesa-vulkan-drivers vulkan-tools libvulkan1 \
            libavcodec-dev libavutil-dev libswscale-dev
          {
            echo "DAWN_INSTALL=$RUNNER_TEMP/dawn-install"
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json"
            echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json"
          } >> "$GITHUB_ENV"

      - name: Pin ccache directory
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ruffle-shard-${{ matrix.shard }}-${{ inputs.mode }}-${{ github.run_id }}
          restore-keys: |
            ccache-ruffle-shard-${{ matrix.shard }}-${{ inputs.mode }}-
            ccache-ruffle-shard-${{ matrix.shard }}-
            ccache-ruffle-shard-

      - name: Configure ccache
        run: |
          # Cap each cache entry at 200 MiB. With ~30 shards each saving up
          # to this much, total ccache usage stays under 6 GiB and leaves
          # room for the Dawn cache (~few hundred MiB) under the 10 GiB
          # per-repo limit. Larger values trigger eviction storms that drop
          # the Dawn cache.
          ccache --max-size=200M
          ccache -z

      - name: Download SWFRecomp binary
        uses: actions/download-artifact@v7
        with:
          name: setup-binary
          path: SWFRecomp/build/

      - name: Make SWFRecomp binary executable
        run: chmod +x SWFRecomp/build/SWFRecomp

      - name: Download recompiled test data
        uses: actions/download-artifact@v7
        with:
          name: setup-tests
          path: ruffle-tests/

      - name: Verify AVM1 (shard ${{ matrix.shard }})
        if: env.RUN_AVM1 == 'true'
        timeout-minutes: 30
        env:
          TZ: NPT-5:45
        run: |
          SHARD="${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          LIMIT_ARGS=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARGS="--limit=${{ inputs.limit }}"
          fi
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --json=ruffle-tests/results-shard-avm1-${{ matrix.shard }}.json \
            --shard="$SHARD" $LIMIT_ARGS || true

      - name: Upload AVM1 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}-avm1
          path: ruffle-tests/results-shard-avm1-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify Shumway (shard ${{ matrix.shard }})
        if: "!cancelled() && env.RUN_SHUMWAY == 'true'"
        timeout-minutes: 10
        env:
          TZ: NPT-5:45
        run: |
          SHARD="${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$SHUMWAY_AVM1_DIR" \
            --json=ruffle-tests/results-shard-shumway_avm1-${{ matrix.shard }}.json \
            --shard="$SHARD" || true
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$SHUMWAY_FLAT_DIR" \
            --json=ruffle-tests/results-shard-shumway_flat-${{ matrix.shard }}.json \
            --shard="$SHARD" || true

      - name: Upload Shumway results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}-shumway
          path: ruffle-tests/results-shard-shumway_*-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify Gnash (shard ${{ matrix.shard }})
        if: "!cancelled() && env.RUN_GNASH == 'true'"
        timeout-minutes: 60
        env:
          TZ: NPT-5:45
        run: |
          SHARD="${{ matrix.shard }}/${{ needs.setup-parallel.outputs.total }}"
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$GNASH_SWFMILL_DIR" \
            --json=ruffle-tests/results-shard-gnash_swfmill-${{ matrix.shard }}.json \
            --shard="$SHARD" || true
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$GNASH_AS_DIR" \
            --json=ruffle-tests/results-shard-gnash_as-${{ matrix.shard }}.json \
            --shard="$SHARD" || true
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$GNASH_MTASC_DIR" \
            --json=ruffle-tests/results-shard-gnash_mtasc-${{ matrix.shard }}.json \
            --shard="$SHARD" || true
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$GNASH_MING_DIR" \
            --json=ruffle-tests/results-shard-gnash_ming-${{ matrix.shard }}.json \
            --shard="$SHARD" \
            --exclude=gotoFrame2Test || true
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --tests-dir="$GNASH_SWFC_DIR" \
            --json=ruffle-tests/results-shard-gnash_swfc-${{ matrix.shard }}.json \
            --shard="$SHARD" \
            --exclude=gotoFrameFromInterval --exclude=gotoFrameFromInterval2 || true

      - name: Upload Gnash results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-shard-${{ matrix.shard }}-gnash
          path: ruffle-tests/results-shard-gnash_*-${{ matrix.shard }}.json
          retention-days: 7

      - name: ccache stats (shard ${{ matrix.shard }})
        if: always()
        run: ccache -s

  # --- Combine shard results ---
  combine-results:
    name: Combine Results
    if: inputs.parallel != '1' && inputs.single_test == '' && !cancelled()
    needs: [setup-parallel, ruffle-tests-shard]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip Pillow

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential ccache

      - name: Pin ccache directory
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ruffle-combine-${{ github.run_id }}
          restore-keys: |
            ccache-ruffle-combine-
            ccache-ruffle-shard-

      - name: Configure ccache
        run: |
          # Cap each cache entry at 200 MiB. With ~30 shards each saving up
          # to this much, total ccache usage stays under 6 GiB and leaves
          # room for the Dawn cache (~few hundred MiB) under the 10 GiB
          # per-repo limit. Larger values trigger eviction storms that drop
          # the Dawn cache.
          ccache --max-size=200M
          ccache -z

      - name: Download SWFRecomp binary
        uses: actions/download-artifact@v7
        with:
          name: setup-binary
          path: SWFRecomp/build/

      - name: Make SWFRecomp binary executable
        run: chmod +x SWFRecomp/build/SWFRecomp

      - name: Download recompiled test data
        uses: actions/download-artifact@v7
        with:
          name: setup-tests
          path: ruffle-tests/

      - name: Fetch previous results
        # Must run AFTER artifact download — the setup-tests artifact includes
        # stale _results/ files from the master checkout, which would overwrite
        # the fetched previous results if we fetched first.
        run: |
          DIRS="$AVM1_DIR $SHUMWAY_AVM1_DIR $SHUMWAY_FLAT_DIR $GNASH_SWFMILL_DIR $GNASH_AS_DIR $GNASH_MTASC_DIR $GNASH_MING_DIR $GNASH_SWFC_DIR"
          # Per-mode previous baseline (graphics diffs against graphics, etc.).
          case "${{ inputs.mode }}" in
            graphics) PREV_STEM="results_graphics" ;;
            graphics-headless-legacy) PREV_STEM="results_headless" ;;
            *) PREV_STEM="results" ;;
          esac
          if git fetch origin ruffle-test-results 2>/dev/null; then
            for dir in $DIRS; do
              mkdir -p "$dir/_results"
              git show "origin/ruffle-test-results:$dir/_results/${PREV_STEM}.json" \
                > "$dir/_results/${PREV_STEM}_previous.json" 2>/dev/null || true
            done
          fi

      - name: Download all shard artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: results-shard-*
          path: artifacts

      - name: Combine shard results
        env:
          EXPECTED_SHARDS: ${{ needs.setup-parallel.outputs.total }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 << 'EOF'
          import json, glob, os
          from datetime import datetime, timezone

          expected_shards = int(os.environ.get("EXPECTED_SHARDS") or "0")
          # Mode-specific output filename so a graphics-mode run doesn't
          # overwrite the no-graphics results.json (and vice versa).
          # Mirrors verify_output.py's single-runner path.
          mode = os.environ.get("MODE") or "no-graphics"
          if mode == "graphics":
              out_filename = "results_graphics.json"
          elif mode == "graphics-headless-legacy":
              out_filename = "results_headless.json"
          else:
              out_filename = "results.json"
          print(f"Mode: {mode} → writing combined results to {out_filename}")

          # Map of shard tag -> output results dir
          categories = {
              "avm1": "ruffle-tests/tests/swfs/avm1/_results",
              "shumway_avm1": "ruffle-tests/tests/swfs/from_shumway/avm1/_results",
              "shumway_flat": "ruffle-tests/tests/swfs/from_shumway/_results",
              "gnash_swfmill": "ruffle-tests/tests/swfs/from_gnash/misc-swfmill.all/_results",
              "gnash_as": "ruffle-tests/tests/swfs/from_gnash/actionscript.all/_results",
              "gnash_mtasc": "ruffle-tests/tests/swfs/from_gnash/misc-mtasc.all/_results",
              "gnash_ming": "ruffle-tests/tests/swfs/from_gnash/misc-ming.all/_results",
              "gnash_swfc": "ruffle-tests/tests/swfs/from_gnash/misc-swfc.all/_results",
          }

          for tag, out_dir in categories.items():
              pattern = f"artifacts/results-shard-*/results-shard-{tag}-*.json"
              files = sorted(glob.glob(pattern))
              if not files:
                  print(f"{tag}: no shard files found, skipping")
                  continue

              actual_shards = len(files)
              missing_shards = max(0, expected_shards - actual_shards) if expected_shards > 0 else 0
              if missing_shards > 0:
                  print(f"::warning::{tag}: only {actual_shards}/{expected_shards} shards produced results ({missing_shards} missing)")
              print(f"{tag}: combining {actual_shards} shard files")

              combined_tests = []
              total_duration = 0
              total_available = 0
              git_sha = None
              breakdown = {}
              pass_count = 0
              ruffle_matched_count = 0
              interrupted_shards = 0

              for f in files:
                  with open(f) as fp:
                      data = json.load(fp)
                  combined_tests.extend(data.get("tests", []))
                  m = data.get("metadata", {})
                  total_duration += m.get("duration_seconds", 0)
                  total_available = max(total_available, m.get("total_available", 0))
                  if not git_sha:
                      git_sha = m.get("git_sha")
                  pass_count += data.get("pass", 0)
                  ruffle_matched_count += data.get("ruffle_matched", 0)
                  for k, v in data.get("breakdown", {}).items():
                      breakdown[k] = breakdown.get(k, 0) + v
                  if m.get("interrupted"):
                      interrupted_shards += 1

              # ruffle_matched lives in the shard breakdowns as an info entry —
              # strip it here because the combined report surfaces it as a
              # dedicated top-level field and the "breakdown" section is
              # reserved for genuine failure categories.
              breakdown.pop("ruffle_matched", None)

              total = len(combined_tests)
              effective_pass = pass_count + ruffle_matched_count
              metadata = {
                  "timestamp": datetime.now(timezone.utc).isoformat(),
                  "git_sha": git_sha,
                  "duration_seconds": round(total_duration, 2),
                  "total_available": total_available,
                  "shards": actual_shards,
              }
              if expected_shards > 0:
                  metadata["expected_shards"] = expected_shards
              if missing_shards > 0:
                  metadata["missing_shards"] = missing_shards
                  metadata["incomplete"] = True
              if interrupted_shards > 0:
                  metadata["interrupted_shards"] = interrupted_shards
                  metadata["incomplete"] = True
                  print(f"::warning::{tag}: {interrupted_shards} shard(s) were interrupted (partial results)")

              report = {
                  "metadata": metadata,
                  "total": total,
                  "pass": pass_count,
                  "ruffle_matched": ruffle_matched_count,
                  "fail": total - effective_pass,
                  "pass_rate": round(100 * pass_count / total, 1) if total else 0,
                  "effective_pass": effective_pass,
                  "effective_pass_rate": round(100 * effective_pass / total, 1) if total else 0,
                  "breakdown": {k: v for k, v in breakdown.items() if v},
                  "tests": sorted(combined_tests, key=lambda t: t["test"]),
              }

              os.makedirs(out_dir, exist_ok=True)
              with open(f"{out_dir}/{out_filename}", "w") as fp:
                  json.dump(report, fp, indent=2)

              suffix = f" — INCOMPLETE ({missing_shards} shards missing)" if missing_shards > 0 else ""
              if ruffle_matched_count:
                  print(f"  {pass_count}/{total} passing ({report['pass_rate']}%),"
                        f" +{ruffle_matched_count} ruffle_matched →"
                        f" {effective_pass}/{total} effective ({report['effective_pass_rate']}%){suffix}")
              else:
                  print(f"  {pass_count}/{total} passing ({report['pass_rate']}%){suffix}")
          EOF

      - name: Verify Flash-spec expected output
        if: always()
        env:
          TZ: NPT-5:45
        run: |
          echo "=== Running Flash-spec tests (output.flash.txt) ==="
          python3 ruffle-tests/verify_output.py -v \
            --mode='${{ inputs.mode }}' \
            --expected-suffix=flash || true

      - name: ccache stats
        if: always()
        run: ccache -s

      # Filter / diff / markdown / index generation moved to the "Commit
      # results" step below so it runs AFTER the branch switch to
      # ruffle-test-results. That way the .md files reflect the merged
      # state (this run's results + previous runs' inherited results)
      # rather than master's potentially-stale snapshot.

      - name: Generate step summary
        if: always()
        run: |
          python3 << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, glob, os
          print("## Ruffle Test Results\n")
          for rj in sorted(glob.glob("ruffle-tests/tests/swfs/**/_results/results.json", recursive=True)):
              with open(rj) as f:
                  r = json.load(f)
              cat = os.path.dirname(rj).replace("ruffle-tests/tests/swfs/", "").replace("/_results", "")
              m = r.get("metadata", {})
              fj = os.path.join(os.path.dirname(rj), "results_filtered.json")
              try:
                  with open(fj) as f:
                      rf = json.load(f)
                  ignored = rf["metadata"].get("ignored_count", 0)
                  rf_rm = rf.get("ruffle_matched", 0)
                  rf_eff = rf.get("effective_pass", rf["pass"])
                  rf_eff_rate = rf.get("effective_pass_rate", rf["pass_rate"])
                  r_rm = r.get("ruffle_matched", 0)
                  print(f"### {cat}")
                  if rf_rm:
                      print(f"**{rf_eff}/{rf['total']}** effective ({rf_eff_rate}%)"
                            f" = {rf['pass']} pass + {rf_rm} ruffle_matched — filtered")
                  else:
                      print(f"**{rf['pass']}/{rf['total']}** passing ({rf['pass_rate']}%) — filtered")
                  if r_rm:
                      print(f"({r['pass']}+{r_rm} rm / {r['total']} raw, {ignored} ignored)\n")
                  else:
                      print(f"({r['pass']}/{r['total']} raw, {ignored} ignored)\n")
              except FileNotFoundError:
                  r_rm = r.get("ruffle_matched", 0)
                  print(f"### {cat}")
                  if r_rm:
                      r_eff = r.get("effective_pass", r["pass"])
                      r_eff_rate = r.get("effective_pass_rate", r["pass_rate"])
                      print(f"**{r_eff}/{r['total']}** effective ({r_eff_rate}%)"
                            f" = {r['pass']} pass + {r_rm} ruffle_matched\n")
                  else:
                      print(f"**{r['pass']}/{r['total']}** passing ({r['pass_rate']}%)\n")
              if m.get("incomplete"):
                  ms = m.get("missing_shards", 0)
                  es = m.get("expected_shards", 0)
                  print(f"> **⚠️ Incomplete: {es - ms}/{es} shards produced results ({ms} missing)**\n")
              if m.get("git_sha"):
                  print(f"Commit: `{m['git_sha'][:12]}`")
              if m.get("duration_seconds"):
                  dur = m['duration_seconds']
                  shards = m.get('shards', 1)
                  print(f"Duration: {dur:.0f}s total across {shards} shard(s)")
              print()
          PYEOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruffle-test-results
          path: |
            ruffle-tests/tests/swfs/**/_results/
            RUFFLE_RESULTS.md
            RUFFLE_RESULTS_FILTERED.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit results to ruffle-test-results branch
        if: always()
        run: |
          # Per-mode result-JSON stem. Each CI run produces a fresh
          # {STEM}.json plus a fetched {STEM}_previous.json; everything else
          # (filter / diff / markdown / index) is regenerated below against
          # the merged ruffle-test-results state so the committed reports
          # cover ALL modes consistently — not just the one we just ran.
          case "${{ inputs.mode }}" in
            graphics) STEM="results_graphics" ;;
            graphics-headless-legacy) STEM="results_headless" ;;
            *) STEM="results" ;;
          esac

          if ! find ruffle-tests/tests/swfs -path "*/_results/${STEM}.json" 2>/dev/null | grep -q .; then
            echo "No ${STEM}.json files to commit (mode=${{ inputs.mode }})"
            exit 0
          fi

          # Save this run's JSON outputs to /tmp before the branch switch
          # (the JSONs are this run's only unique contribution — everything
          # else gets regenerated from the merged state).
          find ruffle-tests/tests/swfs -path '*/_results' -type d | while read dir; do
            for name in "${STEM}.json" "${STEM}_previous.json"; do
              if [ -f "$dir/$name" ]; then
                mkdir -p "/tmp/results_backup/$dir"
                cp "$dir/$name" "/tmp/results_backup/$dir/"
              fi
            done
          done
          # Also stash the post-processing scripts so they survive the branch
          # switch even if origin/ruffle-test-results lags master.
          mkdir -p /tmp/scripts_backup
          cp -r scripts /tmp/scripts_backup/ 2>/dev/null || true
          mkdir -p /tmp/scripts_backup/ruffle-tests
          cp ruffle-tests/filter_results.py /tmp/scripts_backup/ruffle-tests/ 2>/dev/null || true
          cp ruffle-tests/ignored_tests.txt /tmp/scripts_backup/ruffle-tests/ 2>/dev/null || true
          # Per-suite ignore lists live alongside each suite directory.
          # Back them up so the filter step sees master's versions instead
          # of the (stale) copies inherited from the ruffle-test-results
          # branch — otherwise per-suite ignored_tests.txt edits on master
          # never reach filter_results.py.
          find ruffle-tests/tests/swfs -name ignored_tests.txt -print0 2>/dev/null | \
            while IFS= read -r -d '' f; do
              mkdir -p "/tmp/scripts_backup/$(dirname "$f")"
              cp "$f" "/tmp/scripts_backup/$f"
            done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

          # Discard working tree so we can switch branches cleanly. Files
          # we need are already in /tmp.
          git reset --hard HEAD
          # Also delete untracked `*_previous.json` files written by the
          # "Fetch previous results" step. They're untracked on master but
          # tracked on ruffle-test-results, so the checkout below would
          # refuse with "untracked working tree files would be overwritten".
          # The ones we need are already saved to /tmp/results_backup.
          find ruffle-tests/tests/swfs -path '*/_results/*_previous.json' -delete 2>/dev/null || true

          # Inherit from existing ruffle-test-results so prior runs' results
          # (in any mode) are preserved. Falls back to current HEAD if the
          # branch doesn't exist yet (first-ever push).
          if git show-ref --verify --quiet refs/remotes/origin/ruffle-test-results; then
            git checkout -B ruffle-test-results origin/ruffle-test-results
          else
            git checkout -B ruffle-test-results
          fi

          # Remove stale files from old workflow layout
          for f in ruffle-results.md ruffle-results-diff.md ruffle-results-filtered.md \
                   ruffle-results-headless.md ruffle-image-results.md \
                   ruffle-tests/results.json ruffle-tests/results_diff.json \
                   ruffle-tests/results_filtered.json ruffle-tests/image_results.json \
                   ruffle-tests/results-index.md test_results.json; do
            git rm -f "$f" 2>/dev/null || true
          done

          # Restore this mode's JSON outputs onto the inherited branch state.
          find /tmp/results_backup/ruffle-tests/tests/swfs -path '*/_results' -type d 2>/dev/null | while read dir; do
            real_dir="${dir#/tmp/results_backup/}"
            mkdir -p "$real_dir"
            cp "$dir"/* "$real_dir/" 2>/dev/null || true
          done

          # Restore scripts in case origin/ruffle-test-results lacks newer
          # versions (the user merges results back periodically; in between,
          # ruffle-test-results may lag master on script changes).
          if [ -d /tmp/scripts_backup/scripts ]; then
            cp -r /tmp/scripts_backup/scripts/* scripts/ 2>/dev/null || true
          fi
          if [ -f /tmp/scripts_backup/ruffle-tests/filter_results.py ]; then
            cp /tmp/scripts_backup/ruffle-tests/filter_results.py ruffle-tests/
          fi
          if [ -f /tmp/scripts_backup/ruffle-tests/ignored_tests.txt ]; then
            cp /tmp/scripts_backup/ruffle-tests/ignored_tests.txt ruffle-tests/
          fi
          # Restore per-suite ignore lists onto the ruffle-test-results
          # working tree (see the backup step above) so filter_results.py
          # reads master's versions and the commit carries them forward.
          if [ -d /tmp/scripts_backup/ruffle-tests/tests/swfs ]; then
            find /tmp/scripts_backup/ruffle-tests/tests/swfs -name ignored_tests.txt -print0 2>/dev/null | \
              while IFS= read -r -d '' f; do
                dest="${f#/tmp/scripts_backup/}"
                mkdir -p "$(dirname "$dest")"
                cp "$f" "$dest"
              done
          fi

          # Regenerate filtered results for every mode JSON we now have.
          # filter_results.py derives the output name from the input stem
          # (results.json → results_filtered.json,
          #  results_graphics.json → results_graphics_filtered.json, etc.).
          for stem in results results_graphics results_headless; do
            find ruffle-tests/tests/swfs -path "*/_results/${stem}.json" | while read f; do
              python3 ruffle-tests/filter_results.py "$f" || true
            done
          done

          # Regenerate the per-mode diff report against this run's previous
          # baseline (fetched into ${STEM}_previous.json before tests ran
          # and carried over from /tmp).
          find ruffle-tests/tests/swfs -path "*/_results/${STEM}.json" | while read f; do
            dir=$(dirname "$f")
            if [ -f "$dir/${STEM}_previous.json" ]; then
              python3 scripts/diff_ruffle_results.py "$dir/${STEM}_previous.json" "$f" \
                --json="$dir/${STEM}_diff.json" --markdown="$dir/${STEM}_diff.md" || true
            fi
          done

          # Regenerate markdown reports + cross-suite index for every mode.
          python3 scripts/generate_ruffle_results_markdown.py --scan || true
          python3 scripts/generate_results_index.py || true

          find ruffle-tests/tests/swfs -path '*/_results/*.json' -o -path '*/_results/*.md' | xargs git add -f 2>/dev/null || true
          git add -f RUFFLE_RESULTS*.md 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          LIMIT_MSG=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_MSG=" (limit=${{ inputs.limit }})"
          fi
          MODE_MSG=""
          if [ "${{ inputs.mode }}" != "no-graphics" ]; then
            MODE_MSG=" (mode=${{ inputs.mode }})"
          fi

          git commit -m "Update Ruffle test results${MODE_MSG}${LIMIT_MSG}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push -f origin ruffle-test-results

      - name: Prune old ccache entries
        # Defense-in-depth against the per-repo 10 GiB cache cap. Each run
        # produces ~30 ccache entries (~200 MiB each post-shrink), so caches
        # accumulate fast. Without pruning, older runs' caches push out the
        # Dawn cache (which is small and not refreshed every run). Keep the
        # 2 most recent entries per cache-key prefix; delete the rest.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          to_delete=$(gh cache list --limit 500 --order desc --sort created_at \
            --json id,key | \
            jq -r '
              [.[] | select(.key | startswith("ccache-ruffle-")) |
                {id: .id, prefix: (.key | sub("-[0-9]+$"; ""))}] |
              group_by(.prefix) |
              map(.[2:]) |
              flatten |
              .[].id
            ')
          if [ -z "$to_delete" ]; then
            echo "No old ccache entries to prune."
            exit 0
          fi
          echo "$to_delete" | while read -r id; do
            [ -z "$id" ] && continue
            echo "Pruning ccache id=$id"
            gh cache delete "$id" || true
          done
