name: Deploy GitHub Pages (with SWF build)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y swfmill
          pip install fonttools Pillow

      - name: Generate test SWFs
        run: |
          # Generate trace test SWFs (pure Python, no swfmill needed)
          for dir in SWFRecomp/tests/*/; do
            if [ -f "${dir}create_test_swf.py" ]; then
              test_name=$(basename "$dir")
              echo "Generating ${test_name}/test.swf..."
              cd "$dir"
              python3 create_test_swf.py
              cd - > /dev/null
            fi
          done

          # Generate graphics test SWFs (need swfmill)
          for dir in SWFRecomp/tests/graphics/*/; do
            if [ -f "${dir}create_test_swf.py" ]; then
              test_name=$(basename "$dir")
              echo "Generating graphics/${test_name}/test.swf..."
              cd "$dir"
              python3 create_test_swf.py
              cd - > /dev/null
            fi
          done

      - name: Copy SWFs to docs
        run: |
          # Copy trace test SWFs to docs/examples/
          for dir in SWFRecomp/tests/*/; do
            test_name=$(basename "$dir")
            src="${dir}test.swf"
            dest="docs/examples/${test_name}/test.swf"
            if [ -f "$src" ] && [ -d "docs/examples/${test_name}" ]; then
              cp "$src" "$dest"
            fi
          done

          # Copy graphics test SWFs to docs/examples/graphics/
          for dir in SWFRecomp/tests/graphics/*/; do
            test_name=$(basename "$dir")
            src="${dir}test.swf"
            dest="docs/examples/graphics/${test_name}/test.swf"
            if [ -f "$src" ] && [ -d "docs/examples/graphics/${test_name}" ]; then
              cp "$src" "$dest"
            fi
          done

          # Copy recompiler demo SWFs from test generators
          cp SWFRecomp/tests/add_swf_4/test.swf docs/recompiler/add.swf
          cp SWFRecomp/tests/graphics/keyboard_input/test.swf docs/recompiler/keyboard_input.swf

      - name: Install WASI-SDK
        run: |
          WASI_VERSION=30
          wget -q "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sdk-${WASI_VERSION}.0-x86_64-linux.tar.gz" \
            -O wasi-sdk.tar.gz
          tar xzf wasi-sdk.tar.gz
          mv "wasi-sdk-${WASI_VERSION}.0-x86_64-linux" wasi-sdk

      - name: Build pre-compiled runtime objects
        run: |
          WASI_CC="wasi-sdk/bin/clang"
          WASI_SYSROOT="wasi-sdk/share/wasi-sysroot"
          SWFMODERN_ROOT="SWFModernRuntime"
          SWFMODERN_SRC="${SWFMODERN_ROOT}/src"
          SWFMODERN_INC="${SWFMODERN_ROOT}/include"

          WASI_CFLAGS=(
              --target=wasm32-wasi
              --sysroot="${WASI_SYSROOT}"
              -DNO_GRAPHICS
              -I"${SWFMODERN_INC}"
              -I"${SWFMODERN_INC}/actionmodern"
              -I"${SWFMODERN_INC}/libswf"
              -I"${SWFMODERN_INC}/memory"
              -I"${SWFMODERN_ROOT}/lib/c-hashmap"
              -I"${SWFMODERN_ROOT}/lib/o1heap"
              -I"${SWFMODERN_SRC}/actionmodern"
              -I"${SWFMODERN_ROOT}/third_party/libtess2"
              -mllvm -wasm-enable-sjlj
              -matomics -mbulk-memory
              -std=gnu17
              -O2
              -w
          )

          echo "Compiling action.o..."
          "${WASI_CC}" "${WASI_CFLAGS[@]}" -c "${SWFMODERN_SRC}/actionmodern/action.c" -o "docs/recompiler/runtime_src/action.o"
          echo "  action.o: $(stat --printf='%s' docs/recompiler/runtime_src/action.o) bytes"

          echo "Compiling object.o..."
          "${WASI_CC}" "${WASI_CFLAGS[@]}" -c "${SWFMODERN_SRC}/actionmodern/object.c" -o "docs/recompiler/runtime_src/object.o"
          echo "  object.o: $(stat --printf='%s' docs/recompiler/runtime_src/object.o) bytes"

      - name: Write build info
        run: |
          printf '{\n  "deployed_at": "%s",\n  "commit": "%s",\n  "source": "ci"\n}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$(git rev-parse --short HEAD)" \
            > docs/recompiler/build_info.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
