name: Deploy GitHub Pages (with SWF build)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y swfmill
          pip install fonttools Pillow

      - name: Generate test SWFs
        run: |
          # Generate trace test SWFs (pure Python, no swfmill needed)
          for dir in SWFRecomp/tests/*/; do
            if [ -f "${dir}create_test_swf.py" ]; then
              test_name=$(basename "$dir")
              echo "Generating ${test_name}/test.swf..."
              cd "$dir"
              python3 create_test_swf.py
              cd - > /dev/null
            fi
          done

          # Generate graphics test SWFs (need swfmill)
          for dir in SWFRecomp/tests/graphics/*/; do
            if [ -f "${dir}create_test_swf.py" ]; then
              test_name=$(basename "$dir")
              echo "Generating graphics/${test_name}/test.swf..."
              cd "$dir"
              python3 create_test_swf.py
              cd - > /dev/null
            fi
          done

      - name: Copy SWFs to docs
        run: |
          # Copy trace test SWFs to docs/examples/
          for dir in SWFRecomp/tests/*/; do
            test_name=$(basename "$dir")
            src="${dir}test.swf"
            dest="docs/examples/${test_name}/test.swf"
            if [ -f "$src" ] && [ -d "docs/examples/${test_name}" ]; then
              cp "$src" "$dest"
            fi
          done

          # Copy graphics test SWFs to docs/examples/graphics/
          for dir in SWFRecomp/tests/graphics/*/; do
            test_name=$(basename "$dir")
            src="${dir}test.swf"
            dest="docs/examples/graphics/${test_name}/test.swf"
            if [ -f "$src" ] && [ -d "docs/examples/graphics/${test_name}" ]; then
              cp "$src" "$dest"
            fi
          done

      # The dashboard's numbers come from master (per-suite
      # _results/image_results_graphics.json, merged from ruffle-test-results).
      # The rendered PNGs come from ruffle-image-results, which is force-pushed
      # as one commit per image run and must never be merged into master — so
      # fetch it here and copy only what the page needs into the artifact. This
      # step is best-effort by design: a missing or stale images branch must
      # degrade the page to a table, not fail the deploy.
      - name: Fetch published render images (best effort)
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/imgbranch"
          mkdir -p "$RUNNER_TEMP/imgbranch"
          git fetch --depth=1 origin ruffle-image-results
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/imgbranch"
          echo "Fetched $(find "$RUNNER_TEMP/imgbranch" -name '*.png' | wc -l) PNGs."

      # The expected PNGs are NOT in this repo at any ref: upstream test data is
      # downloaded per run by download_tests.sh and every suite dir but
      # `regression` is gitignored. Fetch just the goldens from upstream Ruffle
      # — blob-filtered sparse checkout of *.expected.png, ~7s and no SWFs.
      # Best-effort for the same reason as the step above.
      - name: Fetch expected PNGs from upstream Ruffle (best effort)
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/ruffle-expected"
          mkdir -p "$RUNNER_TEMP/ruffle-expected"
          cd "$RUNNER_TEMP/ruffle-expected"
          git init -q .
          git remote add origin https://github.com/ruffle-rs/ruffle.git
          git config core.sparseCheckout true
          git sparse-checkout set --no-cone '/tests/tests/swfs/**/*.expected.png'
          git fetch --depth=1 --filter=blob:none -q origin master
          git checkout -q FETCH_HEAD
          echo "Fetched $(find . -name '*.expected.png' | wc -l) expected PNGs."

      - name: Build image-comparison dashboard
        run: |
          python3 scripts/generate_image_dashboard.py \
            --stem=graphics \
            --out=docs/image-dashboard/index.html \
            --asset-dir=docs/image-dashboard/img \
            --images-dir="$RUNNER_TEMP/imgbranch" \
            --expected-dir="$RUNNER_TEMP/ruffle-expected"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
