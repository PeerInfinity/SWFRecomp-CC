name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but skip the Pages upload/deploy (validates the workflow)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Pin emsdk to the version used locally (same as ruffle-tests.yml).
      EMSDK_VERSION: '5.0.0'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # The dashboard's numbers come from master (per-suite
      # _results/image_results_graphics.json, merged from ruffle-test-results).
      # The rendered PNGs come from ruffle-image-results, which is force-pushed
      # as one commit per image run and must never be merged into master — so
      # fetch it here and copy only what the page needs into the artifact. This
      # step is best-effort by design: a missing or stale images branch must
      # degrade the page to a table, not fail the deploy.
      - name: Fetch published render images (best effort)
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/imgbranch"
          mkdir -p "$RUNNER_TEMP/imgbranch"
          git fetch --depth=1 origin ruffle-image-results
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/imgbranch"
          echo "Fetched $(find "$RUNNER_TEMP/imgbranch" -name '*.png' | wc -l) PNGs."

      # The expected PNGs are NOT in this repo at any ref: upstream test data is
      # downloaded per run by download_tests.sh and every suite dir but
      # `regression` is gitignored. Fetch just the goldens from upstream Ruffle
      # — blob-filtered sparse checkout of *.expected.png, ~7s and no SWFs.
      # Best-effort for the same reason as the step above.
      - name: Fetch expected PNGs from upstream Ruffle (best effort)
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/ruffle-expected"
          mkdir -p "$RUNNER_TEMP/ruffle-expected"
          cd "$RUNNER_TEMP/ruffle-expected"
          git init -q .
          git remote add origin https://github.com/ruffle-rs/ruffle.git
          git config core.sparseCheckout true
          git sparse-checkout set --no-cone '/tests/tests/swfs/**/*.expected.png'
          git fetch --depth=1 --filter=blob:none -q origin master
          git checkout -q FETCH_HEAD
          echo "Fetched $(find . -name '*.expected.png' | wc -l) expected PNGs."

      - name: Build image-comparison dashboard
        run: |
          python3 scripts/generate_image_dashboard.py \
            --stem=graphics \
            --out=docs/image-dashboard/index.html \
            --asset-dir=docs/image-dashboard/img \
            --images-dir="$RUNNER_TEMP/imgbranch" \
            --expected-dir="$RUNNER_TEMP/ruffle-expected"

      # Cache + set up emsdk exactly like ruffle-tests.yml's wasm smoke job
      # (same cache key, so the two workflows share one warm emsdk tree).
      - name: Restore emsdk cache
        id: emsdk_cache
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-wasm-smoke-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Set up emsdk (cache miss)
        if: steps.emsdk_cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git emsdk
          cd emsdk
          ./emsdk install "${EMSDK_VERSION}"
          ./emsdk activate "${EMSDK_VERSION}"

      # Generates docs/recompiler/{SWFRecomp.js,SWFRecomp.wasm,build_info.json,bundle/}
      # (all gitignored): the Emscripten build of the recompiler plus the
      # runtime-snapshot build bundle the page zips for download.
      - name: Build in-browser recompiler + build bundle
        run: |
          bash SWFRecomp/scripts/deploy_wasm_demo.sh --build
          echo "bundle: $(find docs/recompiler/bundle -type f | wc -l) files, $(du -sh docs/recompiler/bundle | cut -f1)"
          ls -la docs/recompiler/SWFRecomp.wasm docs/recompiler/build_info.json

      - name: Setup Pages
        if: ${{ !inputs.dry_run }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: ${{ !inputs.dry_run }}
        id: deployment
        uses: actions/deploy-pages@v4
