<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWFRecomp - In-Browser SWF Recompiler</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26A1;</text></svg>">
    <script>
        // Configure coi-serviceworker to always use credentialless COEP mode.
        // This enables SharedArrayBuffer while allowing cross-origin imports
        // (e.g. @wasmer/sdk from unpkg.com). require-corp mode blocks these.
        window.coi = { coepCredentialless: () => true, coepDegrade: () => false };
    </script>
    <script src="coi-serviceworker.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 { color: #e94560; margin-bottom: 0.5rem; }
        .subtitle { color: #888; margin-bottom: 0.5rem; }
        .chrome-note { color: #e9a045; font-size: 0.85em; margin-bottom: 2rem; }
        .demo-btn {
            background: #16213e;
            color: #4ecca3;
            border: 1px solid #4ecca3;
            border-radius: 8px;
            padding: 0.5rem 1.5rem;
            font-size: 0.9em;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }
        .demo-btn:hover { background: rgba(78, 204, 163, 0.1); }
        .drop-zone {
            width: 100%;
            max-width: 600px;
            border: 2px dashed #555;
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.05);
        }
        .drop-zone input { display: none; }
        #status {
            width: 100%;
            max-width: 600px;
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: #16213e;
            display: none;
        }
        #status.visible { display: block; }
        .status-step { color: #888; margin: 0.25rem 0; }
        .status-step.active { color: #e94560; }
        .status-step.done { color: #4ecca3; }
        .status-step.error { color: #ff6b6b; }
        #output-container {
            width: 100%;
            max-width: 600px;
            display: none;
        }
        #output-container.visible { display: block; }
        #output-label { color: #4ecca3; margin-bottom: 0.5rem; font-weight: 600; }
        #output {
            width: 100%;
            background: #0f0f23;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #ccc;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>SWFRecomp</h1>
    <p class="subtitle">In-Browser SWF to WASM Recompiler</p>
    <p class="chrome-note">Requires Chrome (Firefox not yet supported)</p>

    <div class="drop-zone" id="dropZone">
        <p>Drop a .swf file here</p>
        <p style="color: #666; margin-top: 0.5rem; font-size: 0.9em">or click to select</p>
        <input type="file" id="fileInput" accept=".swf">
    </div>

    <button class="demo-btn" id="demoBtn">Try example: add.swf</button>

    <div id="status">
        <div class="status-step" id="step-recompile">Recompiling SWF to C...</div>
        <div class="status-step" id="step-compile">Compiling C to WASM...</div>
        <div class="status-step" id="step-run">Running WASM...</div>
    </div>

    <div id="output-container">
        <div id="output-label">Trace Output</div>
        <pre id="output"></pre>
    </div>

    <script type="module" src="pipeline.js"></script>
</body>
</html>
