<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWFRecomp Demo - display_editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; padding: 20px; }
h1 { color: #7B1FA2; margin-bottom: 10px; font-size: 1.3em; }
.layout { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
canvas { border: 1px solid #555; border-radius: 4px; background: #000; }
#json-editor { background: #111; border: 1px solid #333; border-radius: 8px;
               padding: 15px; font-family: monospace; font-size: 13px; color: #e0e0e0;
               flex: 1; min-width: 300px; height: 400px; resize: vertical;
               tab-size: 2; }
#output { background: #111; border: 1px solid #333; border-radius: 8px;
           padding: 15px; white-space: pre-wrap; font-size: 13px;
           width: 100%; max-height: 200px; overflow-y: auto; margin-top: 10px; }
button { background: #7B1FA2; color: white; border: none; padding: 8px 20px;
         border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px; }
button:hover { background: #6A1B9A; }
button:disabled { background: #555; cursor: default; }
.info { color: #888; font-size: 0.9em; margin-bottom: 10px; }
.controls { margin-top: 10px; }
</style>
</head>
<body>
<h1>display_editor</h1>
<p class="info">Recompiled SWF with WebGPU rendering — edit display list JSON live</p>
<div class="controls">
  <button id="btn-run" disabled onclick="startDemo()">Run SWF</button>
  <button id="btn-refresh" disabled onclick="refreshData()">Refresh</button>
  <button id="btn-apply" disabled onclick="applyData()">Apply</button>
</div>
<div class="layout">
  <canvas id="canvas" width="400" height="400"></canvas>
  <textarea id="json-editor" placeholder="Click Run SWF, then Refresh to see display list JSON here..."></textarea>
</div>
<div id="output"></div>
<script>
var output = document.getElementById('output');
var swfRunning = false;

window.Module = {
    locateFile: function(path) { return 'display_editor/' + path.replace('test.', 'display_editor.'); },
    canvas: document.getElementById('canvas'),
    print: function(text) {
        if (text.indexOf('display_editor:') === 0) return;
        output.textContent += text + '\n';
    },
    printErr: function(text) { output.textContent += '[stderr] ' + text + '\n'; },
    onRuntimeInitialized: function() {
        document.getElementById('btn-run').disabled = false;
        output.textContent = 'WASM module loaded. Click Run SWF.\n';
    }
};

function startDemo() {
    document.getElementById('btn-run').disabled = true;
    output.textContent = '';
    Module.ccall('runSWF', null, [], [], {async: true}).then(function() {
        output.textContent += '\n=== done ===\n';
        swfRunning = false;
        document.getElementById('btn-refresh').disabled = true;
        document.getElementById('btn-apply').disabled = true;
    }).catch(function(e) {
        output.textContent += '\nError: ' + e.message + '\n';
    });
    swfRunning = true;
    document.getElementById('btn-refresh').disabled = false;
    document.getElementById('btn-apply').disabled = false;
}

function refreshData() {
    if (!swfRunning) return;
    var json = Module.ccall('getDisplayListJSON', 'string', [], []);
    try {
        var parsed = JSON.parse(json);
        document.getElementById('json-editor').value = JSON.stringify(parsed, null, 2);
    } catch(e) {
        document.getElementById('json-editor').value = json;
    }
}

function applyData() {
    if (!swfRunning) return;
    try {
        var data = JSON.parse(document.getElementById('json-editor').value);
        data.displayList.forEach(function(obj) {
            Module.ccall('setObjectTransform', null,
                ['number','number','number','number','number','number'],
                [obj.depth, obj.x, obj.y, obj.xscale, obj.yscale, obj.rotation]);
        });
        output.textContent += 'Applied transforms for ' + data.displayList.length + ' objects.\n';
    } catch(e) {
        output.textContent += 'Error applying JSON: ' + e.message + '\n';
    }
}
</script>
<script src="display_editor/display_editor.js"></script>
</body>
</html>
