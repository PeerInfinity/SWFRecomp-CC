<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruffle Display Editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; padding: 20px; }
h1 { color: #1565C0; margin-bottom: 10px; font-size: 1.3em; }
.layout { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
#ruffle-container {
    width: 400px; height: 400px; background: #fff; border: 1px solid #555;
    border-radius: 4px; flex-shrink: 0;
}
#ruffle-container ruffle-player { width: 100%; height: 100%; }
#json-editor {
    background: #111; border: 1px solid #333; border-radius: 8px;
    padding: 15px; font-family: monospace; font-size: 13px; color: #e0e0e0;
    flex: 1; min-width: 300px; height: 400px; resize: vertical; tab-size: 2;
}
#output {
    background: #111; border: 1px solid #333; border-radius: 8px;
    padding: 15px; white-space: pre-wrap; font-size: 13px;
    width: 100%; max-height: 200px; overflow-y: auto; margin-top: 10px;
}
button {
    background: #1565C0; color: white; border: none; padding: 8px 20px;
    border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px;
}
button:hover { background: #1256A0; }
button:disabled { background: #555; cursor: default; }
.info { color: #888; font-size: 0.9em; margin-bottom: 10px; }
.controls { margin-top: 10px; }
.drop-zone {
    border: 2px dashed #555; border-radius: 8px; padding: 12px 20px;
    text-align: center; cursor: pointer; transition: all 0.2s;
    display: inline-block; margin-left: 12px; vertical-align: middle;
    color: #888; font-size: 0.9em;
}
.drop-zone:hover, .drop-zone.dragover {
    border-color: #1565C0; color: #ccc; background: rgba(21, 101, 192, 0.1);
}
.drop-zone input { display: none; }
.loaded-name { color: #1565C0; font-size: 0.9em; margin-left: 12px; }
</style>
</head>
<body>
<h1>Ruffle Display Editor</h1>
<p class="info">AS2 SWF running in Ruffle — edit display list via ExternalInterface</p>
<div class="controls">
  <button id="btn-refresh" disabled onclick="refreshData()">Refresh</button>
  <button id="btn-apply" disabled onclick="applyData()">Apply</button>
  <div class="drop-zone" id="dropZone">
    Drop .swf or click to load
    <input type="file" id="fileInput" accept=".swf">
  </div>
  <span id="loaded-name" class="loaded-name"></span>
</div>
<div class="layout">
  <div id="ruffle-container"></div>
  <textarea id="json-editor" placeholder="Loading Ruffle... Refresh to see display list JSON."></textarea>
</div>
<div id="output"></div>
<script>
var output = document.getElementById('output');
var player = null;
var bridgeReady = false;
var wrapperMode = 'as2'; // 'as2' or 'as3'
var ruffleObj = null; // cached RufflePlayer.newest()

function log(msg) {
    output.textContent += msg + '\n';
    output.scrollTop = output.scrollHeight;
}

function getSwfVersion(bytes) {
    // SWF header byte 3 is the version number (works for FWS, CWS, ZWS)
    if (bytes.length >= 4) return bytes[3];
    return 0;
}

// --- Drop zone ---
var dropZone = document.getElementById('dropZone');
var fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', function() { fileInput.click(); });
dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', function() {
    dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) loadDroppedSwf(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function() {
    if (fileInput.files[0]) loadDroppedSwf(fileInput.files[0]);
});

function loadDroppedSwf(file) {
    if (!file.name.toLowerCase().endsWith('.swf')) {
        log('Please select a .swf file');
        return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
        var bytes = new Uint8Array(e.target.result);
        var version = getSwfVersion(bytes);
        var needAS3 = version >= 9;
        log(file.name + ': SWF version ' + version + (needAS3 ? ' (AS3)' : ' (AS2)'));
        document.getElementById('loaded-name').textContent = file.name + ' (SWF' + version + ')';

        var blob = new Blob([bytes], {type: 'application/x-shockwave-flash'});
        var blobUrl = URL.createObjectURL(blob);

        // Switch wrapper if needed
        var neededMode = needAS3 ? 'as3' : 'as2';
        if (neededMode !== wrapperMode || !bridgeReady) {
            loadWrapper(neededMode, function() {
                callLoadSwf(blobUrl, file.name);
            });
        } else {
            callLoadSwf(blobUrl, file.name);
        }
    };
    reader.readAsArrayBuffer(file);
}

function callLoadSwf(blobUrl, filename) {
    try {
        player.ruffle().callExternalInterface('loadSwf', blobUrl);
        log('loadSwf called. Click Refresh after a moment to see the display list.');
    } catch(err) {
        log('Error calling loadSwf: ' + err.message);
    }
}

// --- Ruffle setup ---
function loadWrapper(mode, onReady) {
    var wrapperUrl = 'ruffle_editor/wrapper_' + mode + '.swf';
    wrapperMode = mode;
    bridgeReady = false;
    document.getElementById('btn-refresh').disabled = true;
    document.getElementById('btn-apply').disabled = true;

    function doLoad() {
        log('Loading ' + mode.toUpperCase() + ' wrapper...');
        player.ruffle().load({
            url: wrapperUrl,
            autoplay: 'on',
            allowScriptAccess: true,
            letterbox: 'off'
        }).then(function() {
            log('Wrapper SWF loaded (' + mode + ').');
            setTimeout(function() {
                try {
                    var check = player.ruffle().callExternalInterface('wireCheck');
                    if (check === 'ok') {
                        bridgeReady = true;
                        document.getElementById('btn-refresh').disabled = false;
                        document.getElementById('btn-apply').disabled = false;
                        log('ExternalInterface bridge ready.');
                        if (onReady) onReady();
                    } else {
                        log('wireCheck returned: ' + check);
                    }
                } catch(e) {
                    log('ExternalInterface not available: ' + e.message);
                }
            }, 500);
        }).catch(function(e) {
            log('Failed to load wrapper: ' + e.message);
        });
    }

    if (!ruffleObj) {
        // First load — fetch Ruffle from CDN
        log('Loading Ruffle from CDN...');
        var script = document.createElement('script');
        script.src = 'https://unpkg.com/@ruffle-rs/ruffle';
        script.onload = function() {
            ruffleObj = window.RufflePlayer.newest();
            player = ruffleObj.createPlayer();
            player.style.width = '100%';
            player.style.height = '100%';
            var container = document.getElementById('ruffle-container');
            container.appendChild(player);
            player.ruffle().traceObserver = function(msg) {
                log('[trace] ' + msg);
            };
            doLoad();
        };
        script.onerror = function() { log('Failed to load Ruffle from CDN.'); };
        document.head.appendChild(script);
    } else {
        doLoad();
    }
}

// Start with AS2 wrapper by default
loadWrapper('as2', null);

function refreshData() {
    if (!player || !bridgeReady) return;
    try {
        var json = player.ruffle().callExternalInterface('getDisplayList');
        if (typeof json === 'string') {
            var parsed = JSON.parse(json);
            document.getElementById('json-editor').value = JSON.stringify(parsed, null, 2);
            log('Refreshed: ' + parsed.displayList.length + ' objects.');
        } else {
            document.getElementById('json-editor').value = JSON.stringify(json, null, 2);
        }
    } catch(e) {
        log('Error refreshing: ' + e.message);
    }
}

function applyData() {
    if (!player || !bridgeReady) return;
    try {
        var data = JSON.parse(document.getElementById('json-editor').value);
        data.displayList.forEach(function(obj) {
            if (wrapperMode === 'as3') {
                // AS3 uses scaleX/scaleY (1.0 = 100%)
                var sx = obj.scaleX !== undefined ? obj.scaleX : (obj.xscale !== undefined ? obj.xscale / 100 : 1);
                var sy = obj.scaleY !== undefined ? obj.scaleY : (obj.yscale !== undefined ? obj.yscale / 100 : 1);
                player.ruffle().callExternalInterface('setTransform',
                    obj.name, obj.x, obj.y, sx, sy, obj.rotation);
            } else {
                // AS2 uses _xscale/_yscale (100 = 100%)
                var xs = obj.xscale !== undefined ? obj.xscale : (obj.scaleX !== undefined ? obj.scaleX * 100 : 100);
                var ys = obj.yscale !== undefined ? obj.yscale : (obj.scaleY !== undefined ? obj.scaleY * 100 : 100);
                player.ruffle().callExternalInterface('setTransform',
                    obj.name, obj.x, obj.y, xs, ys, obj.rotation);
            }
        });
        log('Applied transforms for ' + data.displayList.length + ' objects.');
    } catch(e) {
        log('Error applying: ' + e.message);
    }
}

loadRuffle();
</script>
</body>
</html>
