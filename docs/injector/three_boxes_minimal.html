<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>three_boxes_minimal</title>
<style>
body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; padding: 20px; }
canvas { border: 1px solid #555; }
#output { background: #111; padding: 10px; white-space: pre-wrap; margin-top: 10px; max-height: 300px; overflow-y: auto; }
button { background: #7B1FA2; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; margin: 10px 0; }
button:disabled { background: #555; }
</style>
</head>
<body>
<h2>three_boxes_minimal (build_test.sh flags)</h2>
<button id="btn-run" disabled onclick="startDemo()">Run SWF</button><br>
<canvas id="canvas" width="550" height="400"></canvas>
<div id="output"></div>
<script>
var output = document.getElementById('output');
window.Module = {
    locateFile: function(path) { return 'three_boxes_minimal/' + path.replace('minimal_test.', 'three_boxes_minimal.'); },
    canvas: document.getElementById('canvas'),
    print: function(text) { output.textContent += text + '\n'; },
    printErr: function(text) { output.textContent += '[stderr] ' + text + '\n'; },
    onRuntimeInitialized: function() {
        document.getElementById('btn-run').disabled = false;
        output.textContent = 'Ready.\n';
    }
};
function startDemo() {
    document.getElementById('btn-run').disabled = true;
    output.textContent = '';
    Module.ccall('runSWF', null, [], [], {async: true}).then(function() {
        output.textContent += '\n=== done ===\n';
    }).catch(function(e) {
        output.textContent += '\nError: ' + e.message + '\n';
    });
}
</script>
<script src="three_boxes_minimal/three_boxes_minimal.js"></script>
</body>
</html>
