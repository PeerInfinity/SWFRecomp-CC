<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SWFRecomp Phase 1 Test</title>
    <style>
        body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 2rem; }
        pre { background: #0f0f23; padding: 1rem; border: 1px solid #333; border-radius: 8px; white-space: pre-wrap; max-height: 600px; overflow-y: auto; }
        .drop-zone {
            border: 2px dashed #555; border-radius: 12px; padding: 2rem;
            text-align: center; cursor: pointer; margin-bottom: 1rem;
        }
        .drop-zone:hover { border-color: #e94560; }
        .drop-zone input { display: none; }
    </style>
</head>
<body>
    <h2>SWFRecomp Phase 1 Test - SWF to C</h2>
    <div class="drop-zone" id="dropZone">
        <p>Drop a .swf file to recompile</p>
        <input type="file" id="fileInput" accept=".swf">
    </div>
    <pre id="output">Waiting for file...</pre>

    <script type="module">
        const output = document.getElementById("output");
        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");

        let Module = null;

        async function loadModule() {
            if (Module) return Module;
            output.textContent = "Loading SWFRecomp.wasm...";
            const createModule = (await import("./SWFRecomp.js")).default;
            Module = await createModule();
            output.textContent = "SWFRecomp.wasm loaded. Drop a .swf file.";
            return Module;
        }

        async function processSwf(arrayBuffer) {
            const M = await loadModule();

            // Clean previous
            for (const dir of ["RecompiledTags", "RecompiledScripts"]) {
                try {
                    const files = M.FS.readdir(dir).filter(f => f !== "." && f !== "..");
                    for (const f of files) M.FS.unlink(`${dir}/${f}`);
                    M.FS.rmdir(dir);
                } catch {}
            }

            M.FS.writeFile("input.swf", new Uint8Array(arrayBuffer));
            M.FS.writeFile("config.toml", [
                "[input]",
                'path_to_swf = "input.swf"',
                'output_tags_folder = "RecompiledTags"',
                'output_scripts_folder = "RecompiledScripts"',
                "",
            ].join("\n"));

            output.textContent = "Recompiling...\n";
            M.callMain(["config.toml"]);

            output.textContent = "=== Generated Files ===\n\n";
            for (const dir of ["RecompiledTags", "RecompiledScripts"]) {
                let entries;
                try {
                    entries = M.FS.readdir(dir).filter(f => f !== "." && f !== "..");
                } catch {
                    output.textContent += `(${dir} not created)\n`;
                    continue;
                }
                for (const file of entries.sort()) {
                    const content = new TextDecoder().decode(M.FS.readFile(`${dir}/${file}`));
                    output.textContent += `--- ${dir}/${file} (${content.length} bytes) ---\n`;
                    output.textContent += content + "\n\n";
                }
            }
        }

        // Load module on page load
        loadModule();

        dropZone.addEventListener("click", () => fileInput.click());
        dropZone.addEventListener("dragover", (e) => { e.preventDefault(); });
        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = () => processSwf(reader.result);
                reader.readAsArrayBuffer(file);
            }
        });
        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = () => processSwf(reader.result);
                reader.readAsArrayBuffer(file);
            }
        });
    </script>
</body>
</html>
