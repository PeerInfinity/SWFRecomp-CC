<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WASI Shim Test</title>
    <style>
        body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 2rem; }
        pre { background: #0f0f23; padding: 1rem; border: 1px solid #333; border-radius: 8px; }
        .pass { color: #4ecca3; }
        .fail { color: #ff6b6b; }
    </style>
</head>
<body>
    <h2>WASI Shim Test</h2>
    <p>Loading pre-compiled test.wasm and running with minimal WASI shim...</p>
    <pre id="output">Loading...</pre>

    <script type="module">
        import { createWASI } from "./wasi_shim.js";

        const output = document.getElementById("output");

        try {
            const resp = await fetch("./test_add.wasm");
            if (!resp.ok) {
                output.textContent = "ERROR: test_add.wasm not found.\nCopy a pre-compiled test.wasm to the demo directory:\n  cp build_wasm/tests/add/test.wasm wasm_recompiler_demo/test_add.wasm";
                return;
            }
            const wasmBytes = new Uint8Array(await resp.arrayBuffer());
            output.textContent = `Loaded ${wasmBytes.length} bytes, running...\n`;

            const wasi = createWASI();
            const result = await wasi.run(wasmBytes);

            output.textContent += `Exit code: ${result.exitCode}\n\n`;
            output.textContent += `--- stdout ---\n${result.stdout}\n`;
            if (result.stderr) {
                output.textContent += `--- stderr ---\n${result.stderr}\n`;
            }

            // Extract trace output
            const lines = result.stdout.split("\n");
            const trace = lines.filter(l =>
                !l.startsWith("[") && !l.startsWith("===") &&
                !l.startsWith("SWF Runtime") && !l.startsWith("WASM SWF")
            );
            while (trace.length && trace[trace.length - 1] === "") trace.pop();
            while (trace.length && trace[0] === "") trace.shift();

            output.textContent += `\n--- trace only ---\n${trace.join("\n")}\n`;

        } catch (e) {
            output.textContent = `ERROR: ${e.message}\n${e.stack}`;
        }
    </script>
</body>
</html>
