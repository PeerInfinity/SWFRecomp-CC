<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <radialGradient id="rad" gradientUnits="userSpaceOnUse" cx="80" cy="80" r="60">
      <stop offset="0" stop-color="#ffff00"/>
      <stop offset="1" stop-color="#ff0000"/>
    </radialGradient>
    <radialGradient id="foc" gradientUnits="userSpaceOnUse" cx="280" cy="80" r="60" fx="255" fy="55">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#0000ff"/>
    </radialGradient>
    <linearGradient id="reflectg" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="60" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00ff00"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="repeatg" gradientUnits="userSpaceOnUse" x1="220" y1="0" x2="260" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="60" fill="url(#rad)"/>
  <circle cx="280" cy="80" r="60" fill="url(#foc)"/>
  <rect x="20" y="220" width="160" height="80" fill="url(#reflectg)"/>
  <rect x="220" y="220" width="160" height="80" fill="url(#repeatg)"/>
</svg>
