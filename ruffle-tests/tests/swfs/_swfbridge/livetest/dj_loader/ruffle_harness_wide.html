<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DJ level loader — Ruffle</title>
</head>
<body>
<h1>Recompiled-DJ level loader under Ruffle (ground truth)</h1>
<!-- The recompiled-DJ page, Ruffle flavor: the SAME loader-injected SWF and the
     SAME page shim (dj_swf_bridge.js) fulfill the __swfBridge contract under
     both Ruffle and SWFRecomp WASM — Ruffle ExternalInterface.call(name, ...)
     resolves window[name] when allowScriptAccess is on. dj_host_mock.js plays
     host standalone (the real host is Archipelago-CC's iframe bridge). -->
<div id="ruffle-container" style="width:600px;height:400px;background:#fff;"></div>
<script>window.__DJ_STAGE_W=600;</script><script src="regions.js"></script>
<script src="dj_swf_bridge.js"></script>
<script src="dj_host_mock.js"></script>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  var rs = document.createElement('script');
  rs.src = 'https://unpkg.com/@ruffle-rs/ruffle';
  rs.onload = function () {
    window.RufflePlayer.config = {
      allowScriptAccess: true,
      autoplay: 'on',
      unmuteOverlay: 'hidden',
      splashScreen: false,
      warnOnUnsupportedContent: false,
      logLevel: 'info',
    };
    console.log('[harness] Ruffle ready');
    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    player.style.width = "600px";
    player.style.height = '400px';
    document.getElementById('ruffle-container').appendChild(player);
    player.traceObserver = function (m) { console.log(m); };
    fetch('dj_loader.swf').then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
      player.load({ data: buf, allowScriptAccess: true, autoplay: 'on' })
        .then(function () { console.log('[harness] SWF loaded'); })
        .catch(function (e) { console.log('[harness] ruffle load error: ' + e); });
    }).catch(function (e) { console.log('[harness] fetch error: ' + e); });
  };
  rs.onerror = function () { console.log('[harness] ERROR: failed to load Ruffle CDN'); };
  document.head.appendChild(rs);
</script>
</body>
</html>
