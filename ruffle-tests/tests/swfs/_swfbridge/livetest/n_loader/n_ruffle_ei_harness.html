<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>N level loader - Ruffle + __swfBridge (EI)</title>
</head>
<body>
<h1>N loader under Ruffle (EI / __swfBridge)</h1>
<!-- EI tier: the level is fed to the SWF via ExternalInterface (__swfConfig) by
     the page-side bridge + host mock; completion comes back via __swfSendExit.
     This proves the substrate contract on Ruffle. n_host_mock.js configures the
     level (NOT the SWF's baked fixture). allowScriptAccess:true lets Ruffle route
     ExternalInterface.call to window.__swfConfig / window.__swfSendExit. -->
<div id="ruffle-container" style="width:640px;height:480px;background:#000;"></div>
<script src="n_swf_bridge.js"></script>
<script src="n_host_mock.js"></script>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  var rs = document.createElement('script');
  rs.src = 'https://unpkg.com/@ruffle-rs/ruffle';
  rs.onload = function () {
    window.RufflePlayer.config = {
      allowScriptAccess: true,
      autoplay: 'on',
      unmuteOverlay: 'hidden',
      splashScreen: false,
      warnOnUnsupportedContent: false,
      logLevel: 'info',
    };
    console.log('[harness] Ruffle ready');
    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    player.style.width = '640px';
    player.style.height = '480px';
    document.getElementById('ruffle-container').appendChild(player);
    player.traceObserver = function (m) { console.log(m); };
    fetch('n_loader.swf').then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
      player.load({ data: buf, allowScriptAccess: true, autoplay: 'on' })
        .then(function () { console.log('[harness] SWF loaded'); })
        .catch(function (e) { console.log('[harness] ruffle load error: ' + e); });
    }).catch(function (e) { console.log('[harness] fetch error: ' + e); });
  };
  rs.onerror = function () { console.log('[harness] ERROR: failed to load Ruffle CDN'); };
  document.head.appendChild(rs);
</script>
</body>
</html>
